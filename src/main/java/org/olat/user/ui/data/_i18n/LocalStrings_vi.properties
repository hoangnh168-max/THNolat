export.user.data.ready.text=<p>V\u1edbi vai tr\u00f2 qu\u1ea3n tr\u1ecb vi\u00ean ng\u01b0\u1eddi d\u00f9ng trong fLMS, b\u1ea1n \u0111\u00e3 xu\u1ea5t d\u1eef li\u1ec7u c\u00e1 nh\u00e2n c\u1ee7a ng\u01b0\u1eddi d\u00f9ng "{0}". D\u1eef li\u1ec7u hi\u1ec7n \u0111\u00e3 \u0111\u01b0\u1ee3c t\u1ea1o v\u00e0 ng\u01b0\u1eddi d\u00f9ng c\u00f3 th\u1ec3 truy c\u1eadp trong khu v\u1ef1c c\u00e1 nh\u00e2n c\u1ee7a fLMS.</p><p>Ng\u01b0\u1eddi d\u00f9ng c\u00f3 th\u1ec3 truy c\u1eadp tr\u1ef1c ti\u1ebfp d\u1eef li\u1ec7u xu\u1ea5t b\u1eb1ng li\u00ean k\u1ebft sau\: <a href\="{1}">{1}</a><br>B\u1ea1n c\u00f3 th\u1ec3 chuy\u1ec3n ti\u1ebfp li\u00ean k\u1ebft n\u00e0y cho ng\u01b0\u1eddi d\u00f9ng.</p><p>Quan tr\u1ecdng\: Ch\u1ec9 ng\u01b0\u1eddi d\u00f9ng m\u1edbi c\u00f3 th\u1ec3 xem d\u1eef li\u1ec7u n\u00e0y, nh\u1eefng ng\u01b0\u1eddi d\u00f9ng kh\u00e1c trong h\u1ec7 th\u1ed1ng kh\u00f4ng th\u1ec3 xem. V\u1edbi vai tr\u00f2 qu\u1ea3n tr\u1ecb vi\u00ean ng\u01b0\u1eddi d\u00f9ng, b\u1ea1n c\u0169ng kh\u00f4ng c\u00f3 quy\u1ec1n truy c\u1eadp v\u00e0o d\u1eef li\u1ec7u c\u00e1 nh\u00e2n c\u1ee7a ng\u01b0\u1eddi d\u00f9ng.</p>
