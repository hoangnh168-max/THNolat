wizard.step2.attention=<b>CH\u00da \u00dd\:</b> Khi ch\u1ecdn t\u00f9y ch\u1ecdn "X\u00f3a t\u1ea5t c\u1ea3 gia s\u01b0 v\u00e0 h\u1ecdc vi\u00ean kh\u1ecfi c\u00e1c nh\u00f3m h\u1ecdc t\u1eadp v\u00e0 nh\u00f3m quy\u1ec1n c\u1ee7a kh\u00f3a h\u1ecdc n\u00e0y", gia s\u01b0 c\u0169ng nh\u01b0 h\u1ecdc vi\u00ean c\u1ee7a b\u1ea1n c\u00f3 th\u1ec3 kh\u00f4ng c\u00f2n truy c\u1eadp \u0111\u01b0\u1ee3c to\u00e0n b\u1ed9 n\u1ed9i dung kh\u00f3a h\u1ecdc. H\u1ecdc vi\u00ean s\u1ebd kh\u00f4ng c\u00f2n c\u00f3 th\u1ec3 xem l\u1ea1i, ch\u1eb3ng h\u1ea1n nh\u01b0 k\u1ebft qu\u1ea3 b\u00e0i ki\u1ec3m tra c\u1ee7a m\u00ecnh th\u00f4ng qua c\u00f4ng c\u1ee5 \u0111\u00e1nh gi\u00e1 c\u1ee7a kh\u00f3a h\u1ecdc.
wizard.step3.mail.body=*** \u0110\u00e2y l\u00e0 th\u00f4ng b\u00e1o t\u1ef1 \u0111\u1ed9ng. Vui l\u00f2ng kh\u00f4ng tr\u1ea3 l\u1eddi\! ***\r\n\r\nTr\u1ea1ng th\u00e1i c\u1ee7a kh\u00f3a h\u1ecdc {0} \u0111\u00e3 \u0111\u01b0\u1ee3c gia s\u01b0 {1} thay \u0111\u1ed5i th\u00e0nh "\u0110\u00e3 v\u00f4 hi\u1ec7u h\u00f3a".\r\n\r\nKh\u00f3a h\u1ecdc n\u00e0y s\u1ebd kh\u00f4ng c\u00f2n \u0111\u01b0\u1ee3c ph\u1ee5 tr\u00e1ch ho\u1eb7c c\u1eadp nh\u1eadt. N\u1ebfu b\u1ea1n \u0111\u00e3 \u0111\u0103ng k\u00fd c\u00e1c ph\u1ea7n t\u1eed ri\u00eang l\u1ebb c\u1ee7a kh\u00f3a h\u1ecdc, b\u1ea1n c\u00f3 th\u1ec3 h\u1ee7y \u0111\u0103ng k\u00fd trong Trang ch\u1ee7 fLMS, t\u1ea1i menu b\u00ean tr\u00e1i, m\u1ee5c "Th\u00f4ng b\u00e1o". T\u01b0 c\u00e1ch th\u00e0nh vi\u00ean nh\u00f3m c\u1ee7a b\u1ea1n trong kh\u00f3a h\u1ecdc n\u00e0y c\u0169ng c\u00f3 th\u1ec3 b\u1ecb h\u1ee7y. N\u1ebfu c\u1ea7n th\u00eam th\u00f4ng tin, vui l\u00f2ng li\u00ean h\u1ec7 gia s\u01b0 kh\u00f3a h\u1ecdc, {1}.
