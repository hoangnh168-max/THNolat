members.participants.info=Danh s\u00e1ch n\u00e0y hi\u1ec3n th\u1ecb nh\u1eefng ng\u01b0\u1eddi d\u00f9ng c\u00f3 quy\u1ec1n tham gia t\u00e0i nguy\u00ean h\u1ecdc t\u1eadp n\u00e0y. H\u1ecd c\u00f3 th\u1ec3 truy c\u1eadp t\u00e0i nguy\u00ean khi t\u00e0i nguy\u00ean \u0111\u00e3 \u0111\u01b0\u1ee3c xu\u1ea5t b\u1ea3n. Ch\u1ecdn n\u00fat "$\:members.add" ho\u1eb7c "$\:members.import" \u0111\u1ec3 th\u00eam m\u1ed9t ho\u1eb7c nhi\u1ec1u ng\u01b0\u1eddi d\u00f9ng v\u00e0 c\u1ea5p quy\u1ec1n tham gia. <br />N\u1ebfu b\u1ea1n s\u1eed d\u1ee5ng c\u00e1c nh\u00f3m h\u1ecdc t\u1eadp, t\u1ea5t c\u1ea3 ng\u01b0\u1eddi tham gia trong c\u00e1c nh\u00f3m h\u1ecdc t\u1eadp s\u1ebd t\u1ef1 \u0111\u1ed9ng \u0111\u01b0\u1ee3c th\u00eam v\u00e0o danh s\u00e1ch ng\u01b0\u1eddi tham gia n\u00e0y. <br />N\u1ebfu b\u1ea1n s\u1eed d\u1ee5ng t\u00ednh n\u0103ng \u0111\u0103ng k\u00fd, t\u1ea5t c\u1ea3 ng\u01b0\u1eddi tham gia \u0111\u0103ng k\u00fd t\u00e0i nguy\u00ean s\u1ebd t\u1ef1 \u0111\u1ed9ng \u0111\u01b0\u1ee3c th\u00eam v\u00e0o danh s\u00e1ch ng\u01b0\u1eddi tham gia n\u00e0y. <br /> B\u1ea1n c\u00f3 th\u1ec3 x\u00f3a ng\u01b0\u1eddi d\u00f9ng kh\u1ecfi danh s\u00e1ch n\u00e0y b\u1ea5t k\u1ef3 l\u00fac n\u00e0o. Khi \u0111\u00f3, ng\u01b0\u1eddi d\u00f9ng s\u1ebd kh\u00f4ng c\u00f2n quy\u1ec1n truy c\u1eadp t\u00e0i nguy\u00ean n\u00e0y.
