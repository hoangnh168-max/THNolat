members.tutors.info=Danh s\u00e1ch n\u00e0y hi\u1ec3n th\u1ecb nh\u1eefng ng\u01b0\u1eddi d\u00f9ng c\u00f3 quy\u1ec1n h\u01b0\u1edbng d\u1eabn t\u00e0i nguy\u00ean h\u1ecdc t\u1eadp n\u00e0y. H\u1ecd c\u00f3 quy\u1ec1n truy c\u1eadp t\u00e0i nguy\u00ean khi t\u00e0i nguy\u00ean \u0111\u00e3 \u0111\u01b0\u1ee3c xu\u1ea5t b\u1ea3n, t\u01b0\u01a1ng t\u1ef1 nh\u01b0 ng\u01b0\u1eddi tham gia. Trong c\u00e1c kh\u00f3a h\u1ecdc, ng\u01b0\u1eddi h\u01b0\u1edbng d\u1eabn c\u00f3 quy\u1ec1n truy c\u1eadp c\u00f4ng c\u1ee5 \u0111\u00e1nh gi\u00e1. Ch\u1ecdn n\u00fat"$\:members.add" ho\u1eb7c "$\:members.import" \u0111\u1ec3 th\u00eam m\u1ed9t ho\u1eb7c nhi\u1ec1u ng\u01b0\u1eddi d\u00f9ng v\u00e0 c\u1ea5p quy\u1ec1n h\u01b0\u1edbng d\u1eabn. <br />N\u1ebfu b\u1ea1n s\u1eed d\u1ee5ng c\u00e1c nh\u00f3m h\u1ecdc t\u1eadp, t\u1ea5t c\u1ea3 ng\u01b0\u1eddi h\u01b0\u1edbng d\u1eabn c\u1ee7a c\u00e1c nh\u00f3m h\u1ecdc t\u1eadp s\u1ebd t\u1ef1 \u0111\u1ed9ng \u0111\u01b0\u1ee3c th\u00eam v\u00e0o danh s\u00e1ch ng\u01b0\u1eddi h\u01b0\u1edbng d\u1eabn n\u00e0y.
