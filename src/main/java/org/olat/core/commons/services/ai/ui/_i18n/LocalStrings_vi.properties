ai.task.pool.desc=S\u1ed1 l\u01b0\u1ee3ng l\u1ec7nh g\u1ecdi AI song song tr\u00ean m\u1ed7i n\u00fat m\u00e1y ch\u1ee7. K\u00edch th\u01b0\u1edbc ph\u00f9 h\u1ee3p ph\u1ee5 thu\u1ed9c v\u00e0o h\u1ea1 t\u1ea7ng ph\u00eda sau nh\u00e0 cung c\u1ea5p AI: c\u00e1c API \u0111\u00e1m m\u00e2y c\u00f3 th\u1ec3 x\u1eed l\u00fd nhi\u1ec1u l\u1ec7nh g\u1ecdi song song, trong khi m\u00f4 h\u00ecnh t\u1ef1 l\u01b0u tr\u1eef tr\u00ean m\u1ed9t GPU \u0111\u01a1n ch\u1ec9 c\u00f3 th\u1ec3 x\u1eed l\u00fd m\u1ed9t v\u00e0i l\u1ec7nh g\u1ecdi.
ai.task.pool.interactive=Nh\u00f3m "Interactive" (lu\u1ed3ng)
ai.task.pool.interactive.help=D\u00e0nh cho c\u00e1c t\u00e1c v\u1ee5 AI m\u00e0 ng\u01b0\u1eddi d\u00f9ng \u0111ang ch\u1ee7 \u0111\u1ed9ng ch\u1edd k\u1ebft qu\u1ea3, v\u00ed d\u1ee5 nh\u01b0 AI ch\u1ea5m s\u1eeda c\u00e2u tr\u1ea3 l\u1eddi d\u1ea1ng v\u0103n b\u1ea3n t\u1ef1 do. N\u00ean c\u00f3 quy m\u00f4 \u0111\u1ee7 l\u1edbn \u0111\u1ec3 ph\u1ee5c v\u1ee5 m\u1ed9t l\u1edbp h\u1ecdc n\u1ed9p b\u00e0i c\u00f9ng l\u00fac.
ai.task.pool.batch=Nh\u00f3m "Batch" (lu\u1ed3ng)
