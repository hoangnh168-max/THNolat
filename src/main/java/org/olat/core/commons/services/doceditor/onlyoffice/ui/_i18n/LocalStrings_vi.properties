admin.desc=ONLYOFFICE l\u00e0 ph\u1ea7n m\u1ec1m ch\u1ec9nh s\u1eeda t\u00e0i li\u1ec7u tr\u1ef1c tuy\u1ebfn. Ph\u1ea7n m\u1ec1m h\u1ed7 tr\u1ee3 t\u1ea5t c\u1ea3 c\u00e1c \u0111\u1ecbnh d\u1ea1ng t\u1ec7p t\u00e0i li\u1ec7u, b\u1ea3ng t\u00ednh v\u00e0 b\u1ea3n tr\u00ecnh b\u00e0y ph\u1ed5 bi\u1ebfn. C\u00e1c t\u00ednh n\u0103ng n\u1ed5i b\u1eadt bao g\u1ed3m ch\u1ec9nh s\u1eeda c\u1ed9ng t\u00e1c v\u00e0 kh\u1ea3 n\u0103ng h\u1ed7 tr\u1ee3 tuy\u1ec7t v\u1eddi c\u00e1c \u0111\u1ecbnh d\u1ea1ng t\u1ec7p v\u0103n ph\u00f2ng. B\u1ea1n c\u00f3 th\u1ec3 t\u00ecm th\u00eam th\u00f4ng tin tr\u00ean <a href="https://www.onlyoffice.com/" target=_blank>trang web</a> c\u1ee7a ONLYOFFICE
