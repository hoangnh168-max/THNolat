A-9=B\u1ea1n c\u00f3 th\u1ec3 l\u01b0u tr\u1eef c\u00e1c t\u00e0i li\u1ec7u trong th\u01b0 m\u1ee5c c\u00e1 nh\u00e2n \u0111\u1ec3 s\u1eed d\u1ee5ng b\u1ea5t c\u1ee9 l\u00fac n\u00e0o. fLMS cung c\u1ea5p cho b\u1ea1n 20 MB dung l\u01b0\u1ee3ng cho m\u1ee5c \u0111\u00edch n\u00e0y.
