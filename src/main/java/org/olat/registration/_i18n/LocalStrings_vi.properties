disclaimer.paragraph1=Ng\u01b0\u1eddi d\u00f9ng fLMS c\u1ea7n l\u01b0u \u00fd r\u1eb1ng fLMS ch\u1ec9 \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng cho m\u1ee5c \u0111\u00edch h\u1ecdc t\u1eadp ho\u1eb7c gi\u1ea3ng d\u1ea1y. Ng\u01b0\u1eddi d\u00f9ng kh\u00f4ng \u0111\u01b0\u1ee3c vi ph\u1ea1m b\u1ea5t k\u1ef3 lu\u1eadt ph\u00e1p n\u00e0o li\u00ean quan \u0111\u1ebfn h\u00e0nh vi n\u01a1i c\u00f4ng c\u1ed9ng v\u00e0/ho\u1eb7c quy\u1ec1n c\u1ee7a b\u00ean th\u1ee9 ba (quy\u1ec1n \u0111\u1ed1i v\u1edbi t\u00ean, b\u1ea3n quy\u1ec1n, b\u1ea3o v\u1ec7 d\u1eef li\u1ec7u, v.v.). C\u1ee5 th\u1ec3, ng\u01b0\u1eddi d\u00f9ng fLMS cam k\u1ebft kh\u00f4ng ph\u1ed5 bi\u1ebfn b\u1ea5t k\u1ef3 t\u00e0i li\u1ec7u n\u00e0o c\u00f3 n\u1ed9i dung khi\u00eau d\u00e2m, ph\u00e2n bi\u1ec7t ch\u1ee7ng t\u1ed9c, b\u1ea5t h\u1ee3p ph\u00e1p, ph\u00e2n bi\u1ec7t \u0111\u1ed1i x\u1eed ho\u1eb7c b\u1ea1o l\u1ef1c, c\u0169ng nh\u01b0 kh\u00f4ng l\u01b0u tr\u1eef c\u00e1c t\u00e0i li\u1ec7u \u0111\u00f3 tr\u00ean m\u00e1y ch\u1ee7 fLMS. Ngo\u00e0i ra, ng\u01b0\u1eddi d\u00f9ng cam k\u1ebft kh\u00f4ng k\u00edch \u0111\u1ed9ng ho\u1eb7c cung c\u1ea5p b\u1ea5t k\u1ef3 t\u00e0i li\u1ec7u n\u00e0o nh\u1eb1m m\u1ee5c \u0111\u00edch k\u00edch \u0111\u1ed9ng.
disclaimer.paragraph2=\u0110\u01a1n v\u1ecb v\u1eadn h\u00e0nh n\u1ec1n t\u1ea3ng c\u00f3 quy\u1ec1n ch\u1eb7n quy\u1ec1n truy c\u1eadp v\u00e0o m\u00e1y ch\u1ee7 fLMS c\u1ee7a b\u1ea5t k\u1ef3 ng\u01b0\u1eddi d\u00f9ng n\u00e0o vi ph\u1ea1m c\u00e1c \u0111i\u1ec1u ki\u1ec7n tr\u00ean v\u00e0 x\u00f3a d\u1eef li\u1ec7u c\u1ee7a ng\u01b0\u1eddi d\u00f9ng \u0111\u00f3. \u0110\u01a1n v\u1ecb v\u1eadn h\u00e0nh n\u1ec1n t\u1ea3ng c\u0169ng c\u00f3 quy\u1ec1n ti\u1ebfn h\u00e0nh c\u00e1c th\u1ee7 t\u1ee5c ph\u00e1p l\u00fd trong tr\u01b0\u1eddng h\u1ee3p nh\u01b0 v\u1eady.
