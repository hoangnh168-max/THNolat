readme=Ch\u1ec9 th\u1ecb\r\n \r\n V\u1edbi t\u01b0 c\u00e1ch l\u00e0 ng\u01b0\u1eddi nh\u1eadn d\u1eef li\u1ec7u \u0111\u01b0\u1ee3c l\u01b0u tr\u1eef, b\u1ea1n c\u00f3 tr\u00e1ch nhi\u1ec7m \u0111\u1ea3m b\u1ea3o r\u1eb1ng d\u1eef li\u1ec7u n\u00e0y ch\u1ec9 \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng theo \u0111\u00fang quy \u0111\u1ecbnh. \r\n \r\n \r\n- D\u1eef li\u1ec7u c\u00e1 nh\u00e2n ch\u1ec9 \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng cho m\u1ee5c \u0111\u00edch nghi\u00ean c\u1ee9u, gi\u1ea3ng d\u1ea1y v\u00e0 \u0111\u00e1nh gi\u00e1 trong ph\u1ea1m vi li\u00ean quan \u0111\u1ebfn c\u00e1c v\u1ea5n \u0111\u1ec1 c\u1ee7a tr\u01b0\u1eddng \u0111\u1ea1i h\u1ecdc. \r\n \r\n- D\u1eef li\u1ec7u \u1ea9n danh c\u0169ng c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng cho m\u1ee5c \u0111\u00edch th\u1ed1ng k\u00ea. \r\n \r\n- D\u1eef li\u1ec7u c\u00e1 nh\u00e2n ch\u1ec9 \u0111\u01b0\u1ee3c l\u01b0u tr\u1eef trong th\u1eddi gian c\u1ea7n thi\u1ebft. \r\n \r\n- D\u1eef li\u1ec7u kh\u00f4ng c\u1ea7n thi\u1ebft ph\u1ea3i \u0111\u01b0\u1ee3c x\u00f3a.
