wizard.step0.5=Ch\u1ec9 \u0111\u1ecbnh c\u1ed9t ch\u1ee9a k\u1ebft qu\u1ea3 \u0111\u00e1nh gi\u00e1.
wizard.step0.6=M\u1ed9t c\u1ed9t b\u1ed5 sung (ph\u1ea3n h\u1ed3i) \u1edf b\u00ean ph\u1ea3i s\u1ebd cho bi\u1ebft (theo t\u1eebng h\u00e0ng ho\u1eb7c t\u1eebng ng\u01b0\u1eddi d\u00f9ng) li\u1ec7u \u0111\u00e1nh gi\u00e1 c\u1ee7a h\u1ec7 th\u1ed1ng c\u00f3 ch\u00ednh x\u00e1c hay kh\u00f4ng.
wizard.step0.intro1=Tr\u00ecnh h\u01b0\u1edbng d\u1eabn n\u00e0y h\u1ed7 tr\u1ee3 b\u1ea1n \u0111\u00e1nh gi\u00e1 nhi\u1ec1u ng\u01b0\u1eddi d\u00f9ng c\u00f9ng l\u00fac. B\u1ea1n ch\u1ec9 c\u1ea7n m\u1ed9t danh s\u00e1ch g\u1ed3m c\u00e1c h\u00e0ng v\u00e0 c\u00e1c gi\u00e1 tr\u1ecb \u0111\u01b0\u1ee3c ph\u00e2n t\u00e1ch b\u1eb1ng tab ho\u1eb7c d\u1ea5u ph\u1ea9y.
wizard.step0.intro2=M\u1ed9t gi\u00e1 tr\u1ecb ph\u1ea3i l\u00e0 t\u00ean ng\u01b0\u1eddi d\u00f9ng, trong khi m\u1ed9t gi\u00e1 tr\u1ecb kh\u00e1c d\u00f9ng \u0111\u1ec3 \u0111\u00e1nh gi\u00e1. Thay v\u00ec nh\u1eadp t\u00ean ng\u01b0\u1eddi d\u00f9ng, b\u1ea1n c\u0169ng c\u00f3 th\u1ec3 s\u1eed d\u1ee5ng \u0111\u1ecba ch\u1ec9 E-mail t\u01b0\u01a1ng \u1ee9ng.
wizard.step0.intro3=B\u1ea1n c\u00f3 th\u1ec3 s\u1eed d\u1ee5ng \u0111i\u1ec3m, "\u0110\u1ea1t/Kh\u00f4ng \u0111\u1ea1t" ho\u1eb7c nh\u1eadn x\u00e9t. "y" c\u00f3 ngh\u0129a l\u00e0 "\u0110\u1ea1t", trong khi "n" c\u00f3 ngh\u0129a l\u00e0 "Kh\u00f4ng \u0111\u1ea1t".
