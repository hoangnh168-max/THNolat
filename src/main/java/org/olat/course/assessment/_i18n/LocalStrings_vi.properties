wizard.step0.2=Ch\u1ecdn th\u00e0nh ph\u1ea7n kh\u00f3a h\u1ecdc. B\u1ea1n ch\u1ec9 c\u00f3 th\u1ec3 ch\u1ecdn gi\u1eefa c\u00e1c th\u00e0nh ph\u1ea7n kh\u00f3a h\u1ecdc c\u00f3 c\u1ea5u h\u00ecnh v\u00e0 lo\u1ea1i \u0111\u00e1nh gi\u00e1 ph\u00f9 h\u1ee3p.
