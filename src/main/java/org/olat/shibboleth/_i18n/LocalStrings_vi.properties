admin.description=S\u1eed d\u1ee5ng c\u00e1c bi\u1ec3u m\u1eabu b\u00ean d\u01b0\u1edbi \u0111\u1ec3 c\u1ea5u h\u00ecnh c\u00e1c quy t\u1eafc ph\u00e2n quy\u1ec1n t\u00f9y ch\u1ecdn. \u0110i\u1ec1u n\u00e0y h\u1eefu \u00edch khi b\u1ea1n mu\u1ed1n h\u1ea1n ch\u1ebf quy\u1ec1n truy c\u1eadp v\u00e0o fLMS Resource Provider d\u1ef1a tr\u00ean c\u00e1c thu\u1ed9c t\u00ednh Shibboleth v\u00ec kh\u00f4ng ph\u1ea3i t\u1ea5t c\u1ea3 ng\u01b0\u1eddi d\u00f9ng x\u00e1c th\u1ef1c th\u00e0nh c\u00f4ng v\u1edbi IDP \u0111\u1ec1u \u0111\u01b0\u1ee3c ph\u00e9p truy c\u1eadp t\u00e0i nguy\u00ean n\u00e0y. N\u1ebfu m\u1ed9t trong c\u00e1c quy t\u1eafc b\u00ean d\u01b0\u1edbi kh\u1edbp, ng\u01b0\u1eddi d\u00f9ng \u0111\u01b0\u1ee3c ph\u00e9p truy c\u1eadp h\u1ec7 th\u1ed1ng fLMS n\u00e0y (ph\u00e9p OR). N\u1ebfu ng\u01b0\u1eddi d\u00f9ng kh\u00f4ng c\u00f3 c\u00e1c thu\u1ed9c t\u00ednh c\u1ea7n thi\u1ebft, quy\u1ec1n truy c\u1eadp s\u1ebd b\u1ecb t\u1eeb ch\u1ed1i. M\u1ed7i gi\u00e1 tr\u1ecb trong danh s\u00e1ch gi\u00e1 tr\u1ecb \u0111\u01b0\u1ee3c coi l\u00e0 m\u1ed9t gi\u00e1 tr\u1ecb h\u1ee3p l\u1ec7 (kh\u00f4ng h\u1ed7 tr\u1ee3 gi\u00e1 tr\u1ecb nhi\u1ec1u d\u00f2ng).
