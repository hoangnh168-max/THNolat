import.taxonomy.step1.desc =<p>\u0110i\u1ec1u quan tr\u1ecdng l\u00e0 ph\u1ea3i gi\u1eef nguy\u00ean c\u00e1c c\u1ed9t nh\u01b0 \u0111\u01b0\u1ee3c hi\u1ec3n th\u1ecb. C\u00e1c c\u1ed9t c\u00f3 d\u1ea5u sao l\u00e0 b\u1eaft bu\u1ed9c:</p><p><ul><li><strong>\u0110\u01b0\u1eddng d\u1eabn *</strong></li><li><strong>Tham chi\u1ebfu *</strong></li><li>Lo\u1ea1i</li><li>Th\u1ee9 t\u1ef1</li><li><strong>Ng\u00f4n ng\u1eef *</strong></li><li><strong>Ti\u00eau \u0111\u1ec1 *</strong></li><li>M\u00f4 t\u1ea3</li></ul></p><p>H\u00e3y l\u01b0u \u00fd r\u1eb1ng n\u1ebfu b\u1ea1n mu\u1ed1n nh\u1eadp c\u00e1c c\u1ea5p ph\u00e2n lo\u1ea1i l\u00e0 c\u1ea5p con c\u1ee7a c\u00e1c c\u1ea5p kh\u00e1c, c\u1ea5p cha ph\u1ea3i t\u1ed3n t\u1ea1i t\u1eeb tr\u01b0\u1edbc ho\u1eb7c \u0111\u01b0\u1ee3c nh\u1eadp \u1edf m\u1ed9t d\u00f2ng b\u1ea5t k\u1ef3 tr\u01b0\u1edbc c\u1ea5p con. B\u1ea1n n\u00ean s\u1eafp x\u1ebfp d\u1eef li\u1ec7u nh\u1eadp theo \u0111\u01b0\u1eddng d\u1eabn.</p>
import.taxonomy.step1.media.desc=<p>\u0110\u1ec3 th\u00eam t\u1ec7p ph\u01b0\u01a1ng ti\u1ec7n v\u00e0o ph\u00e2n lo\u1ea1i, h\u00e3y t\u1ea3i xu\u1ed1ng m\u1eabu v\u00e0 \u0111i\u1ec1n th\u00f4ng tin v\u00e0o c\u00e1c th\u01b0 m\u1ee5c. B\u1ea1n c\u0169ng c\u00f3 th\u1ec3 ch\u1ec9nh s\u1eeda m\u1ed9t ph\u00e2n lo\u1ea1i \u0111\u00e3 xu\u1ea5t v\u00e0 t\u1ea3i l\u00ean d\u01b0\u1edbi d\u1ea1ng t\u1ec7p ZIP.</p>
