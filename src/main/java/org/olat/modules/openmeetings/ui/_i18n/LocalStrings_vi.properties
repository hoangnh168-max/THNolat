room.moderation.mode.desc=N\u1ebfu \u0111\u01b0\u1ee3c b\u1eadt trong ph\u1ea7n qu\u1ea3n tr\u1ecb h\u1ec7 th\u1ed1ng, t\u00f9y ch\u1ecdn n\u00e0y s\u1ebd y\u00eau c\u1ea7u c\u00f3 \u0111i\u1ec1u ph\u1ed1i vi\u00ean trong ph\u00f2ng. Ng\u01b0\u1eddi kh\u00f4ng ph\u1ea3i \u0111i\u1ec1u ph\u1ed1i vi\u00ean v\u1eabn c\u00f3 th\u1ec3 v\u00e0o ph\u00f2ng, nh\u01b0ng kh\u00f4ng th\u1ec3 th\u1ef1c hi\u1ec7n thao t\u00e1c n\u00e0o cho \u0111\u1ebfn khi \u0111i\u1ec1u ph\u1ed1i vi\u00ean tham gia cu\u1ed9c h\u1ecdp. Quy\u1ec1n \u0111i\u1ec1u ph\u1ed1i vi\u00ean \u0111\u01b0\u1ee3c t\u1ef1 \u0111\u1ed9ng c\u1ea5p cho t\u00e1c gi\u1ea3 kh\u00f3a h\u1ecdc v\u00e0 ng\u01b0\u1eddi h\u01b0\u1edbng d\u1eabn c\u1ee7a kh\u00f3a h\u1ecdc trong c\u00e1c kh\u00f3a h\u1ecdc, c\u0169ng nh\u01b0 ng\u01b0\u1eddi h\u01b0\u1edbng d\u1eabn nh\u00f3m trong c\u00e1c nh\u00f3m.
