room.type.desc=Lo\u1ea1i cu\u1ed9c h\u1ecdp. T\u00f9y thu\u1ed9c v\u00e0o lo\u1ea1i, c\u00e1c c\u00f4ng c\u1ee5 kh\u1ea3 d\u1ee5ng v\u00e0 c\u1ea5u h\u00ecnh quy\u1ec1n s\u1ebd kh\u00e1c nhau. H\u1ed9i ngh\u1ecb \u0111\u01b0\u1ee3c t\u1ed1i \u01b0u cho c\u00e1c cu\u1ed9c h\u1ecdp c\u00f3 \u00edt ng\u01b0\u1eddi tham gia, trong \u0111\u00f3 t\u1ea5t c\u1ea3 ng\u01b0\u1eddi tham gia \u0111\u1ec1u c\u00f3 lu\u1ed3ng video \u0111\u1ec3 chia s\u1ebb v\u00e0 c\u00f3 th\u1ec3 s\u1eed d\u1ee5ng t\u1ea5t c\u1ea3 c\u00f4ng c\u1ee5. Ng\u01b0\u1ee3c l\u1ea1i, h\u1ed9i th\u1ea3o tr\u1ef1c tuy\u1ebfn ph\u00f9 h\u1ee3p \u0111\u1ec3 t\u1ed5 ch\u1ee9c m\u1ed9t bu\u1ed5i gi\u1ea3ng v\u1edbi m\u1ed9t ng\u01b0\u1eddi tr\u00ecnh b\u00e0y c\u00f3 video v\u00e0 nhi\u1ec1u ng\u01b0\u1eddi tham gia. Ph\u1ecfng v\u1ea5n l\u00e0 h\u00ecnh th\u1ee9c cu\u1ed9c h\u1ecdp trong \u0111\u00f3 m\u1ed9t ng\u01b0\u1eddi ph\u1ecfng v\u1ea5n ng\u01b0\u1eddi kh\u00e1c v\u00e0 cu\u1ed9c ph\u1ecfng v\u1ea5n c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c ghi l\u1ea1i.
