admin.pools.intro=T\u1ea1o m\u1ed9t ho\u1eb7c nhi\u1ec1u kho c\u00e2u h\u1ecfi. Kho l\u00e0 m\u1ed9t ng\u00e2n h\u00e0ng c\u00e2u h\u1ecfi cho ph\u00e9p t\u1ea5t c\u1ea3 ng\u01b0\u1eddi d\u00f9ng c\u00f3 quy\u1ec1n t\u00e1c gi\u1ea3 trao \u0111\u1ed5i c\u00e1c c\u00e2u h\u1ecfi (truy c\u1eadp c\u00f4ng khai). B\u1ea1n c\u0169ng c\u00f3 th\u1ec3 ch\u1ecdn t\u1ea1o m\u1ed9t kho ch\u1ec9 d\u00e0nh cho m\u1ed9t s\u1ed1 t\u00e1c gi\u1ea3 \u0111\u01b0\u1ee3c ch\u1ec9 \u0111\u1ecbnh, ch\u1eb3ng h\u1ea1n nh\u01b0 nh\u00e2n vi\u00ean c\u1ee7a m\u1ed9t ph\u00f2ng ban (truy c\u1eadp ri\u00eang t\u01b0).
