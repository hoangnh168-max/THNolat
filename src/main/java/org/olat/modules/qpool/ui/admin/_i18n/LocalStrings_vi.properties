admin.configuration.title=Ng\u00e2n h\u00e0ng c\u00e2u h\u1ecfi
admin.levels.intro=T\u1ea1o c\u00e1c c\u1ea5p \u0111\u1ed9 ph\u00f9 h\u1ee3p v\u1edbi c\u1ea5p h\u1ecdc c\u1ee7a t\u1ed5 ch\u1ee9c b\u1ea1n. V\u00ed d\u1ee5 v\u1ec1 c\u00e1c c\u1ea5p \u0111\u1ed9 trong b\u1ed1i c\u1ea3nh gi\u00e1o d\u1ee5c c\u00f3 th\u1ec3 l\u00e0\: ti\u1ec3u h\u1ecdc, trung h\u1ecdc c\u01a1 s\u1edf, trung h\u1ecdc ph\u1ed5 th\u00f4ng, c\u1eed nh\u00e2n, th\u1ea1c s\u0129. Trong b\u1ed1i c\u1ea3nh doanh nghi\u1ec7p, c\u00e1c c\u1ea5p \u0111\u1ed9 c\u00f3 th\u1ec3 bao g\u1ed3m\: ch\u01b0a qua \u0111\u00e0o t\u1ea1o ngh\u1ec1, \u0111\u00e3 qua \u0111\u00e0o t\u1ea1o ngh\u1ec1, h\u00e0nh ch\u00ednh, qu\u1ea3n l\u00fd c\u1ea5p trung, CO
admin.licenses.intro=B\u1ea1n c\u00f3 th\u1ec3 t\u1ea1o th\u00eam c\u00e1c lo\u1ea1i gi\u1ea5y ph\u00e9p n\u1ebfu c\u00e1c lo\u1ea1i gi\u1ea5y ph\u00e9p m\u1eb7c \u0111\u1ecbnh kh\u00f4ng \u0111\u00e1p \u1ee9ng \u0111\u1ee7 nhu c\u1ea7u. L\u01b0u \u00fd r\u1eb1ng kh\u00f4ng th\u1ec3 x\u00f3a c\u00e1c gi\u1ea5y ph\u00e9p m\u1eb7c \u0111\u1ecbnh.
