admin.studyfields.intro=C\u00e1c ch\u1ee7 \u0111\u1ec1 cho ph\u00e9p l\u1eadp ch\u1ec9 m\u1ee5c chuy\u00ean m\u00f4n cho c\u00e1c c\u00e2u h\u1ecfi. Ch\u00fang \u0111\u01b0\u1ee3c t\u1ed5 ch\u1ee9c theo c\u1ea5u tr\u00fac ph\u00e2n c\u1ea5p nh\u1eb1m m\u00f4 h\u00ecnh h\u00f3a c\u00e1c ch\u01b0\u01a1ng tr\u00ecnh \u0111\u00e0o t\u1ea1o c\u00f3 th\u1ec3 c\u00f3. Ch\u1ecdn "$org.olat.modules.taxonomy.ui\:add.taxonomy.level" \u0111\u1ec3 t\u1ea1o ch\u1ee7 \u0111\u1ec1 m\u1edbi ho\u1eb7c ch\u1ecdn m\u1ed9t ch\u1ee7 \u0111\u1ec1 hi\u1ec7n c\u00f3 \u0111\u1ec3 ch\u1ec9nh s\u1eeda.
