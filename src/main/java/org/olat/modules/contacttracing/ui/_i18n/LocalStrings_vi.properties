contact.tracing.registration.confirmation.mail.body=<p>C\u1ea3m \u01a1n b\u1ea1n \u0111\u00e3 \u0111\u0103ng k\u00fd th\u00f4ng tin li\u00ean h\u1ec7\!</p>\r\n<p>Vui l\u00f2ng l\u01b0u gi\u1eef th\u01b0 n\u00e0y trong <strong>{0} ng\u00e0y</strong> v\u00e0 cung c\u1ea5p cho nh\u00e2n vi\u00ean truy v\u1ebft ti\u1ebfp x\u00fac <strong>n\u1ebfu b\u1ea1n x\u00e9t nghi\u1ec7m d\u01b0\u01a1ng t\u00ednh</strong>.</p>\r\n<p>Th\u00f4ng tin n\u00e0y c\u00f3 th\u1ec3 \u0111\u00f3ng vai tr\u00f2 quan tr\u1ecdng trong vi\u1ec7c ng\u0103n ch\u1eb7n chu\u1ed7i l\u00e2y nhi\u1ec5m.</p>\r\n<p>C\u1ea3m \u01a1n s\u1ef1 h\u1ee3p t\u00e1c c\u1ee7a b\u1ea1n\!</p>
