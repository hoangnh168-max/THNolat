contact.tracing.locations.import.instructions=<p>\u0110\u1ec3 nh\u1eadp c\u00e1c \u0111\u1ecba \u0111i\u1ec3m truy v\u1ebft ti\u1ebfp x\u00fac, h\u00e3y t\u1ea3i xu\u1ed1ng m\u1eabu b\u00ean d\u01b0\u1edbi, \u0111i\u1ec1n th\u00f4ng tin v\u00e0 sao ch\u00e9p t\u1ea5t c\u1ea3 c\u00e1c d\u00f2ng, ngo\u1ea1i tr\u1eeb d\u00f2ng ti\u00eau \u0111\u1ec1, v\u00e0o tr\u01b0\u1eddng v\u0103n b\u1ea3n.</p><p>C\u00f3 c\u00e1c t\u00f9y ch\u1ecdn sau. \u0110i\u1ec1u quan tr\u1ecdng l\u00e0 ph\u1ea3i gi\u1eef nguy\u00ean ch\u00ednh x\u00e1c th\u1ee9 t\u1ef1 c\u00e1c c\u1ed9t.</p><ul><li>Tham chi\u1ebfu</li><li>Ti\u00eau \u0111\u1ec1</li><li>T\u00f2a nh\u00e0</li><li>Ph\u00f2ng</li><li>Khu v\u1ef1c</li><li>B\u00e0n</li><li>S\u1ed1 gh\u1ebf (N\u1ebfu c\u00f3 \u00e1p d\u1ee5ng cho \u0111\u1ecba \u0111i\u1ec3m n\u00e0y, nh\u1eadp "{0}", n\u1ebfu kh\u00f4ng nh\u1eadp "{1}")</li><li>Kh\u00e1ch (N\u1ebfu c\u00f3 \u00e1p d\u1ee5ng cho \u0111\u1ecba \u0111i\u1ec3m n\u00e0y, nh\u1eadp "{2}", n\u1ebfu kh\u00f4ng nh\u1eadp "{3}")</li><li>ID QR (T\u00f9y ch\u1ecdn, \u0111\u1ec3 tr\u1ed1ng n\u1ebfu mu\u1ed1n h\u1ec7 th\u1ed1ng t\u1ef1 t\u1ea1o ID)</li><li>N\u1ed9i dung QR (T\u00f9y ch\u1ecdn, nh\u1eadp HTML \u0111\u1ec3 \u0111\u1ecbnh d\u1ea1ng v\u0103n b\u1ea3n)</li></ul><p>B\u1ea1n c\u0169ng c\u00f3 th\u1ec3 ch\u1ec9nh s\u1eeda c\u00e1c \u0111\u1ecba \u0111i\u1ec3m hi\u1ec7n c\u00f3. N\u1ebfu m\u1ed9t \u0111\u1ecba \u0111i\u1ec3m \u0111\u00e3 t\u1ed3n t\u1ea1i trong h\u1ec7 th\u1ed1ng, bi\u1ec3u t\u01b0\u1ee3ng tam gi\u00e1c c\u1ea3nh b\u00e1o s\u1ebd \u0111\u01b0\u1ee3c hi\u1ec3n th\u1ecb \u1edf b\u01b0\u1edbc ti\u1ebfp theo.</p>
