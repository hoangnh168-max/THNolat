contact.tracing.registration.intro=<p>B\u1ea1n s\u1eafp \u0111\u0103ng k\u00fd s\u1ef1 hi\u1ec7n di\u1ec7n c\u1ee7a m\u00ecnh t\u1ea1i \u0111\u1ecba \u0111i\u1ec3m sau \u0111\u00e2y. Quy tr\u00ecnh \u0111\u0103ng k\u00fd n\u00e0y \u0111\u01b0\u1ee3c th\u1ef1c hi\u1ec7n theo c\u00e1c y\u00eau c\u1ea7u c\u1ee7a lu\u1eadt ph\u00f2ng, ch\u1ed1ng \u0111\u1ea1i d\u1ecbch.</p>\r\n<p>D\u1eef li\u1ec7u c\u1ee7a b\u1ea1n \u0111\u01b0\u1ee3c l\u01b0u tr\u1eef ri\u00eang t\u01b0 v\u00e0 kh\u00f4ng li\u00ean k\u1ebft v\u1edbi t\u00e0i kho\u1ea3n ng\u01b0\u1eddi d\u00f9ng.</p>\r\n<p>Gi\u00e1o vi\u00ean ho\u1eb7c qu\u1ea3n tr\u1ecb vi\u00ean kh\u00f3a h\u1ecdc kh\u00f4ng th\u1ec3 tra c\u1ee9u s\u1ef1 hi\u1ec7n di\u1ec7n c\u1ee7a b\u1ea1n. <br />B\u00e1o c\u00e1o ch\u1ec9 \u0111\u01b0\u1ee3c t\u1ea1o theo y\u00eau c\u1ea7u c\u1ee7a nh\u00e2n vi\u00ean truy v\u1ebft ti\u1ebfp x\u00fac c\u1ea5p li\u00ean bang. <br />T\u1ea5t c\u1ea3 d\u1eef li\u1ec7u \u0111\u0103ng k\u00fd s\u1ebd t\u1ef1 \u0111\u1ed9ng b\u1ecb x\u00f3a sau <b>{0} ng\u00e0y</b>.</p> {1}
