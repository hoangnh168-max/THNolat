admin.pseudonyms.descr=T\u1ea1o ho\u1eb7c x\u00f3a b\u00ed danh \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng trong c\u00e1c b\u00e0i \u0111\u0103ng tr\u00ean di\u1ec5n \u0111\u00e0n \u0111\u1ec3 \u0111\u0103ng b\u00e0i \u1ea9n danh. Khi t\u1ea1o b\u00ed danh, h\u1ec7 th\u1ed1ng y\u00eau c\u1ea7u nh\u1eadp \u0111\u00fang m\u1eadt kh\u1ea9u khi b\u00ed danh \u0111\u00f3 \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng l\u1ea1i. Khi x\u00f3a m\u1ed9t b\u00ed danh hi\u1ec7n c\u00f3, h\u1ec7 th\u1ed1ng cho ph\u00e9p b\u1ea5t k\u1ef3 ai s\u1eed d\u1ee5ng l\u1ea1i b\u00ed danh \u0111\u00f3. L\u01b0u \u00fd, vi\u1ec7c x\u00f3a b\u00ed danh t\u1ea1i \u0111\u00e2y KH\u00d4NG x\u00f3a c\u00e1c b\u00ed danh \u0111\u00e3 \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng trong di\u1ec5n \u0111\u00e0n. \u0110\u00e2y ch\u1ec9 l\u00e0 b\u1ea3ng tra c\u1ee9u b\u1ea3o v\u1ec7 b\u1eb1ng m\u1eadt kh\u1ea9u. B\u00ed danh th\u1ef1c t\u1ebf \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng \u0111\u01b0\u1ee3c l\u01b0u trong t\u1eebng b\u00e0i \u0111\u0103ng tr\u00ean di\u1ec5n \u0111\u00e0n.
