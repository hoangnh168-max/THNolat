edit.intro=Theo m\u1eb7c \u0111\u1ecbnh, ch\u1ec9 ch\u1ee7 s\u1edf h\u1eefu c\u1ee7a t\u1eeb \u0111i\u1ec3n thu\u1eadt ng\u1eef m\u1edbi c\u00f3 th\u1ec3 t\u1ea1o c\u00e1c m\u1ee5c t\u1eeb. Khi ch\u1ecdn "Cho ph\u00e9p t\u1ea5t c\u1ea3 ng\u01b0\u1eddi d\u00f9ng c\u00f3 quy\u1ec1n ghi", t\u1eeb \u0111i\u1ec3n thu\u1eadt ng\u1eef n\u00e0y s\u1ebd tr\u1edf th\u00e0nh m\u1ed9t t\u1eeb \u0111i\u1ec3n thu\u1eadt ng\u1eef c\u1ed9ng t\u00e1c, cho ph\u00e9p m\u1ecdi ng\u01b0\u1eddi d\u00f9ng trong h\u1ec7 th\u1ed1ng th\u00eam c\u00e1c m\u1ee5c t\u1eeb m\u1edbi v\u00e0 ch\u1ec9nh s\u1eeda ho\u1eb7c x\u00f3a c\u00e1c m\u1ee5c t\u1eeb do ch\u00ednh h\u1ecd t\u1ea1o. Ch\u1ee7 s\u1edf h\u1eefu t\u1eeb \u0111i\u1ec3n thu\u1eadt ng\u1eef c\u0169ng c\u00f3 th\u1ec3 qu\u1ea3n l\u00fd c\u00e1c m\u1ee5c t\u1eeb c\u1ee7a ng\u01b0\u1eddi d\u00f9ng kh\u00e1c b\u1ea5t c\u1ee9 l\u00fac n\u00e0o. <br /><br />N\u1ebfu b\u1eadt t\u00ednh n\u0103ng n\u00e0y, t\u00e1c gi\u1ea3 c\u1ee7a t\u1eebng m\u1ee5c t\u1eeb v\u00e0 ng\u01b0\u1eddi ch\u1ec9nh s\u1eeda m\u1ee5c t\u1eeb l\u1ea7n cu\u1ed1i s\u1ebd \u0111\u01b0\u1ee3c hi\u1ec3n th\u1ecb b\u00ean c\u1ea1nh thu\u1eadt ng\u1eef.
