wizard.email.explanation=Vui l\u00f2ng nh\u1eadp \u0111\u1ecba ch\u1ec9 email c\u1ee7a th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng m\u00e0 b\u1ea1n mu\u1ed1n th\u00eam. N\u1ebfu ng\u01b0\u1eddi n\u00e0y \u0111\u00e3 l\u00e0 ng\u01b0\u1eddi d\u00f9ng Selectus, th\u00f4ng tin c\u1ee7a h\u1ecd s\u1ebd \u0111\u01b0\u1ee3c t\u1ef1 \u0111\u1ed9ng th\u00eam v\u00e0o h\u1ed9i \u0111\u1ed3ng n\u00e0y. N\u1ebfu kh\u00f4ng, b\u1ea1n c\u00f3 th\u1ec3 b\u1ed5 sung th\u00f4ng tin \u1edf b\u01b0\u1edbc ti\u1ebfp theo. N\u1ebfu kh\u00f4ng bi\u1ebft \u0111\u1ecba ch\u1ec9 email c\u1ee7a m\u1ed9t ng\u01b0\u1eddi d\u00f9ng Selectus hi\u1ec7n c\u00f3, b\u1ea1n c\u00f3 th\u1ec3 nh\u1ea5n v\u00e0o "T\u00ecm ki\u1ebfm ng\u01b0\u1eddi d\u00f9ng". \u0110\u1ec3 th\u00eam nhi\u1ec1u th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng trong m\u1ed9t b\u01b0\u1edbc, h\u00e3y nh\u1eadp nhi\u1ec1u \u0111\u1ecba ch\u1ec9 email v\u00e0 ph\u00e2n c\u00e1ch b\u1eb1ng d\u1ea5u ch\u1ea5m ph\u1ea9y (;).
wizard.email.explanation.azure=Vui l\u00f2ng nh\u1eadp \u0111\u1ecba ch\u1ec9 email c\u1ee7a th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng m\u00e0 b\u1ea1n mu\u1ed1n th\u00eam. N\u1ebfu ng\u01b0\u1eddi n\u00e0y l\u00e0 ng\u01b0\u1eddi d\u00f9ng n\u1ed9i b\u1ed9 ho\u1eb7c \u0111\u00e3 l\u00e0 th\u00e0nh vi\u00ean b\u00ean ngo\u00e0i c\u1ee7a m\u1ed9t h\u1ed9i \u0111\u1ed3ng kh\u00e1c, th\u00f4ng tin c\u1ee7a h\u1ecd s\u1ebd \u0111\u01b0\u1ee3c t\u1ef1 \u0111\u1ed9ng th\u00eam v\u00e0o h\u1ed9i \u0111\u1ed3ng n\u00e0y. N\u1ebfu kh\u00f4ng, b\u1ea1n c\u00f3 th\u1ec3 b\u1ed5 sung th\u00f4ng tin \u1edf b\u01b0\u1edbc ti\u1ebfp theo. N\u1ebfu kh\u00f4ng bi\u1ebft \u0111\u1ecba ch\u1ec9 email c\u1ee7a m\u1ed9t ng\u01b0\u1eddi d\u00f9ng b\u00ean ngo\u00e0i hi\u1ec7n c\u00f3, b\u1ea1n c\u00f3 th\u1ec3 nh\u1ea5n v\u00e0o "T\u00ecm ki\u1ebfm ng\u01b0\u1eddi d\u00f9ng". \u0110\u1ec3 th\u00eam nhi\u1ec1u th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng trong m\u1ed9t b\u01b0\u1edbc, h\u00e3y nh\u1eadp nhi\u1ec1u \u0111\u1ecba ch\u1ec9 email v\u00e0 ph\u00e2n c\u00e1ch b\u1eb1ng d\u1ea5u ch\u1ea5m ph\u1ea9y (;).
wizard.email.explanation.ldap=Vui l\u00f2ng nh\u1eadp \u0111\u1ecba ch\u1ec9 email c\u1ee7a th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng m\u00e0 b\u1ea1n mu\u1ed1n th\u00eam. N\u1ebfu ng\u01b0\u1eddi n\u00e0y l\u00e0 ng\u01b0\u1eddi d\u00f9ng n\u1ed9i b\u1ed9 ho\u1eb7c \u0111\u00e3 l\u00e0 th\u00e0nh vi\u00ean b\u00ean ngo\u00e0i c\u1ee7a m\u1ed9t h\u1ed9i \u0111\u1ed3ng kh\u00e1c, th\u00f4ng tin c\u1ee7a h\u1ecd s\u1ebd \u0111\u01b0\u1ee3c t\u1ef1 \u0111\u1ed9ng th\u00eam v\u00e0o h\u1ed9i \u0111\u1ed3ng n\u00e0y. N\u1ebfu kh\u00f4ng, b\u1ea1n c\u00f3 th\u1ec3 b\u1ed5 sung th\u00f4ng tin \u1edf b\u01b0\u1edbc ti\u1ebfp theo. N\u1ebfu kh\u00f4ng bi\u1ebft \u0111\u1ecba ch\u1ec9 email c\u1ee7a m\u1ed9t ng\u01b0\u1eddi d\u00f9ng n\u1ed9i b\u1ed9 ho\u1eb7c ng\u01b0\u1eddi d\u00f9ng b\u00ean ngo\u00e0i hi\u1ec7n c\u00f3, b\u1ea1n c\u00f3 th\u1ec3 nh\u1ea5n v\u00e0o "T\u00ecm ki\u1ebfm ng\u01b0\u1eddi d\u00f9ng". \u0110\u1ec3 th\u00eam nhi\u1ec1u th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng trong m\u1ed9t b\u01b0\u1edbc, h\u00e3y nh\u1eadp nhi\u1ec1u \u0111\u1ecba ch\u1ec9 email v\u00e0 ph\u00e2n c\u00e1ch b\u1eb1ng d\u1ea5u ch\u1ea5m ph\u1ea9y (;).
