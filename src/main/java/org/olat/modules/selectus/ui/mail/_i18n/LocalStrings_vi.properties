mail.templates.description=B\u1ea1n c\u00f3 th\u1ec3 t\u00f9y ch\u1ec9nh c\u00e1c m\u1eabu email h\u1ec7 th\u1ed1ng c\u1ee7a c\u00e1c ch\u1ee9c n\u0103ng \u0111\u00e3 b\u1eadt ho\u1eb7c - n\u1ebfu \u0111\u00e3 \u0111\u01b0\u1ee3c t\u00f9y ch\u1ec9nh - \u0111\u1eb7t l\u1ea1i v\u1ec1 phi\u00ean b\u1ea3n ban \u0111\u1ea7u.<br>B\u1ea1n c\u0169ng c\u00f3 th\u1ec3 t\u1ea1o th\u00eam c\u00e1c m\u1eabu email d\u00e0nh ri\u00eang cho t\u1eebng v\u1ecb tr\u00ed \u0111\u1ec3 li\u00ean h\u1ec7 v\u1edbi \u1ee9ng vi\u00ean b\u1eb1ng c\u00e1ch nh\u1ea5n n\u00fat "$:add.template". C\u00e1c m\u1eabu d\u00e0nh ri\u00eang cho v\u1ecb tr\u00ed hi\u1ec7n c\u00f3 c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c ch\u1ec9nh s\u1eeda ho\u1eb7c x\u00f3a nh\u01b0ng kh\u00f4ng th\u1ec3 \u0111\u1eb7t l\u1ea1i v\u1ec1 phi\u00ean b\u1ea3n tr\u01b0\u1edbc \u0111\u00f3.
mail.templates.description.with.letter=C\u00e1c m\u1eabu email c\u00f3 th\u01b0 m\u1eabu s\u1ebd bao g\u1ed3m m\u1ed9t th\u01b0 m\u1eabu \u0111\u00ednh k\u00e8m \u1edf \u0111\u1ecbnh d\u1ea1ng PDF. N\u1ed9i dung th\u01b0 m\u1eabu ch\u1ec9 c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c t\u00f9y ch\u1ec9nh/x\u00e1c \u0111\u1ecbnh/ch\u1ec9nh s\u1eeda t\u1ea1i \u0111\u00e2y, kh\u00f4ng th\u1ec3 ch\u1ec9nh s\u1eeda khi g\u1eedi email cho \u1ee9ng vi\u00ean. L\u01b0u \u00fd r\u1eb1ng n\u1ed9i dung th\u01b0 m\u1eabu c\u0169ng s\u1ebd \u0111\u01b0\u1ee3c \u0111\u1eb7t l\u1ea1i khi \u0111\u1eb7t l\u1ea1i m\u1ed9t m\u1eabu email h\u1ec7 th\u1ed1ng c\u00f3 k\u00e8m th\u01b0 m\u1eabu.
mail.templates.description.with.management="X\u00e1c nh\u1eadn h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n kh\u00f4ng c\u00f3 qu\u1ea3n l\u00fd ng\u01b0\u1eddi gi\u1edbi thi\u1ec7u" \u0111\u01b0\u1ee3c b\u1eadt v\u00e0 t\u1ef1 \u0111\u1ed9ng g\u1eedi cho \u1ee9ng vi\u00ean n\u1ebfu ch\u1ee9c n\u0103ng "\u1ee8ng vi\u00ean c\u00f3 th\u1ec3 cung c\u1ea5p v\u00e0 qu\u1ea3n l\u00fd ng\u01b0\u1eddi gi\u1edbi thi\u1ec7u" ch\u01b0a \u0111\u01b0\u1ee3c b\u1eadt.<br>"X\u00e1c nh\u1eadn h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n c\u00f3 qu\u1ea3n l\u00fd ng\u01b0\u1eddi gi\u1edbi thi\u1ec7u" \u0111\u01b0\u1ee3c b\u1eadt v\u00e0 t\u1ef1 \u0111\u1ed9ng g\u1eedi cho \u1ee9ng vi\u00ean n\u1ebfu ch\u1ee9c n\u0103ng "\u1ee8ng vi\u00ean c\u00f3 th\u1ec3 cung c\u1ea5p v\u00e0 qu\u1ea3n l\u00fd ng\u01b0\u1eddi gi\u1edbi thi\u1ec7u" \u0111\u01b0\u1ee3c b\u1eadt.<br>Vui l\u00f2ng truy c\u1eadp "<a href='{0}'>Ng\u01b0\u1eddi gi\u1edbi thi\u1ec7u / chuy\u00ean gia</a>" trong menu \u0111i\u1ec1u h\u01b0\u1edbng ch\u00ednh c\u1ee7a ch\u1ebf \u0111\u1ed9 ch\u1ec9nh s\u1eeda \u0111\u1ec3 c\u1ea5u h\u00ecnh ng\u01b0\u1eddi gi\u1edbi thi\u1ec7u v\u00e0 qu\u1ea3n l\u00fd ng\u01b0\u1eddi gi\u1edbi thi\u1ec7u.
