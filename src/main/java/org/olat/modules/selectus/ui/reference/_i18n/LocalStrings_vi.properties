choose.comparative.assessment.desc=<p>B\u1ea1n c\u00f3 th\u1ec3 ch\u1ecdn</p><ul class\="list-unstyled"><li>a) t\u1ea1o m\u1ed9t \u0111\u00e1nh gi\u00e1 so s\u00e1nh m\u1edbi cho (c\u00e1c) h\u1ed3 s\u01a1 \u0111\u0103ng k\u00fd \u0111\u00e3 ch\u1ecdn ho\u1eb7c</li><li>b) th\u00eam (c\u00e1c) h\u1ed3 s\u01a1 \u0111\u0103ng k\u00fd \u0111\u00e3 ch\u1ecdn v\u00e0o m\u1ed9t \u0111\u00e1nh gi\u00e1 so s\u00e1nh hi\u1ec7n c\u00f3.</li></ul><p>Sau \u0111\u00f3, nh\u1eadp c\u00e1c th\u00f4ng tin \u0111\u01b0\u1ee3c y\u00eau c\u1ea7u. C\u00e1c tr\u01b0\u1eddng c\u00f3 d\u1ea5u sao l\u00e0 b\u1eaft bu\u1ed9c.</p><p>L\u01b0u \u00fd\: Khi ch\u1ecdn m\u1ed9t \u0111\u00e1nh gi\u00e1 so s\u00e1nh hi\u1ec7n c\u00f3, b\u1ea1n \u0111ang ch\u1ec9nh s\u1eeda/c\u1eadp nh\u1eadt \u0111\u00e1nh gi\u00e1 g\u1ed1c. (H\u1ec7 th\u1ed1ng kh\u00f4ng t\u1ea1o b\u1ea3n sao.)</p>
