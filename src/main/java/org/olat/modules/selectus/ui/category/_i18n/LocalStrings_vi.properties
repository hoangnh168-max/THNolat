position.tags.description=T\u1ea1i \u0111\u00e2y, b\u1ea1n c\u00f3 th\u1ec3 b\u1eadt c\u00e1c th\u1ebb h\u1ec7 th\u1ed1ng v\u00e0 th\u1ebb d\u00e0nh ri\u00eang cho v\u1ecb tr\u00ed.<br>N\u1ebfu th\u1ebb h\u1ec7 th\u1ed1ng \u0111\u01b0\u1ee3c b\u1eadt, danh s\u00e1ch c\u00e1c th\u1ebb h\u1ec7 th\u1ed1ng kh\u1ea3 d\u1ee5ng s\u1ebd \u0111\u01b0\u1ee3c hi\u1ec3n th\u1ecb t\u1ea1i \u0111\u00e2y. Th\u1ebb h\u1ec7 th\u1ed1ng ch\u1ec9 c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c ch\u1ec9nh s\u1eeda trong ph\u1ea7n qu\u1ea3n tr\u1ecb h\u1ec7 th\u1ed1ng b\u1edfi ng\u01b0\u1eddi c\u00f3 quy\u1ec1n qu\u1ea3n tr\u1ecb.<br>N\u1ebfu th\u1ebb v\u1ecb tr\u00ed \u0111\u01b0\u1ee3c b\u1eadt, b\u1ea1n c\u00f3 th\u1ec3 th\u00eam, ch\u1ec9nh s\u1eeda, x\u00f3a ho\u1eb7c g\u1ed9p c\u00e1c th\u1ebb t\u1ea1i \u0111\u00e2y. L\u01b0u \u00fd r\u1eb1ng n\u1ebfu m\u1ed9t th\u1ebb c\u00f3 c\u00f9ng t\u00ean t\u1ed3n t\u1ea1i \u1edf c\u1ea3 c\u1ea5p h\u1ec7 th\u1ed1ng v\u00e0 c\u1ea5p v\u1ecb tr\u00ed, th\u1ebb v\u1ecb tr\u00ed t\u01b0\u01a1ng \u1ee9ng s\u1ebd \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng khi th\u00eam v\u00e0o h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n.
