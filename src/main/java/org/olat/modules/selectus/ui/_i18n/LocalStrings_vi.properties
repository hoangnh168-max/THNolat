edit.rating.policy.points.introduction=Theo th\u00f4ng l\u1ec7, c\u00e1c nh\u00e0 khoa h\u1ecdc \u0111\u1ee7 ti\u00eau chu\u1ea9n nh\u01b0ng kh\u00f4ng n\u1ed9p h\u1ed3 s\u01a1 v\u00e0 do \u0111\u00f3 kh\u00f4ng c\u00f3 t\u00ean trong danh s\u00e1ch \u1ee9ng vi\u00ean c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c gi\u1edbi thi\u1ec7u \u1edf b\u1ea5t k\u1ef3 giai \u0111o\u1ea1n n\u00e0o c\u1ee7a quy tr\u00ecnh tuy\u1ec3n ch\u1ecdn. Ch\u00fang t\u00f4i \u0111\u1eb7c bi\u1ec7t khuy\u1ebfn kh\u00edch t\u1ea5t c\u1ea3 th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng tuy\u1ec3n ch\u1ecdn suy ngh\u0129 v\u1ec1 c\u00e1c \u1ee9ng vi\u00ean ti\u1ec1m n\u0103ng h\u00e0ng \u0111\u1ea7u v\u00e0 mang theo CV c\u00f9ng danh s\u00e1ch c\u00f4ng b\u1ed1 khoa h\u1ecdc c\u1ee7a h\u1ecd \u0111\u1ebfn c\u00e1c cu\u1ed9c h\u1ecdp ho\u1eb7c g\u1eedi tr\u01b0\u1edbc cho ch\u00fang t\u00f4i, \u0111\u1ec3 ch\u00fang t\u00f4i c\u00f3 th\u1ec3 chuy\u1ec3n ti\u1ebfp cho t\u1ea5t c\u1ea3 th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng tr\u01b0\u1edbc cu\u1ed9c h\u1ecdp.
