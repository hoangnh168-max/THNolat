edit.form_description=\u0110i\u1ec1n v\u00e0o bi\u1ec3u m\u1eabu b\u00ean d\u01b0\u1edbi \u0111\u1ec3 t\u1ea1o m\u1ed9t v\u1ecb tr\u00ed m\u1edbi. S\u1eed d\u1ee5ng tr\u1ea1ng th\u00e1i v\u1ecb tr\u00ed \u0111\u1ec3 c\u00f4ng b\u1ed1 v\u1ecb tr\u00ed \u0111ang tuy\u1ec3n ho\u1eb7c gi\u1eef v\u1ecb tr\u00ed \u1edf tr\u1ea1ng th\u00e1i chu\u1ea9n b\u1ecb. T\u1ea5t c\u1ea3 c\u00e1c tr\u01b0\u1eddng c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c ch\u1ec9nh s\u1eeda \u1edf giai \u0111o\u1ea1n sau.
edit.form_description.apps.feedback=Ch\u1ecdn xem nh\u00e2n vi\u00ean c\u00f3 th\u1ec3 y\u00eau c\u1ea7u ph\u1ea3n h\u1ed3i t\u1eeb c\u00e1c th\u00e0nh vi\u00ean gi\u1ea3ng vi\u00ean hay kh\u00f4ng. N\u1ebfu c\u00f3, b\u1ea1n c\u00f3 th\u1ec3 c\u1ea5u h\u00ecnh c\u00e1c chi ti\u1ebft b\u00ean d\u01b0\u1edbi. T\u1ea5t c\u1ea3 c\u00e1c tr\u01b0\u1eddng c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c ch\u1ec9nh s\u1eeda \u1edf giai \u0111o\u1ea1n sau.<br>Th\u00e0nh vi\u00ean gi\u1ea3ng vi\u00ean c\u1ea7n \u0111\u0103ng nh\u1eadp \u0111\u1ec3 cung c\u1ea5p ph\u1ea3n h\u1ed3i. B\u1ea1n c\u00f3 th\u1ec3 c\u1ea5u h\u00ecnh kh\u1ea3 n\u0103ng hi\u1ec3n th\u1ecb t\u00e0i li\u1ec7u h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n \u0111\u1ed1i v\u1edbi th\u00e0nh vi\u00ean gi\u1ea3ng vi\u00ean trong tab "$\:edit.step.references.visibility".
edit.form_description.comparative.experts=Ch\u1ecdn xem nh\u00e2n vi\u00ean c\u00f3 th\u1ec3 th\u00eam chuy\u00ean gia \u0111\u1ec3 \u0111\u00e1nh gi\u00e1 so s\u00e1nh nhi\u1ec1u h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n hay kh\u00f4ng; n\u1ebfu c\u00f3, h\u00e3y c\u1ea5u h\u00ecnh c\u00e1c chi ti\u1ebft b\u00ean d\u01b0\u1edbi. Chuy\u00ean gia n\u00e0y \u0111\u01b0\u1ee3c c\u1ea5p quy\u1ec1n truy c\u1eadp v\u00e0o m\u1ed9t t\u1eadp h\u1ee3p h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n v\u00e0 c\u00f3 th\u1ec3 t\u1ea3i l\u00ean m\u1ed9t t\u1ec7p duy nh\u1ea5t ch\u1ee9a \u0111\u00e1nh gi\u00e1 so s\u00e1nh c\u00e1c h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n \u0111\u00f3.<br>Sau khi b\u1eadt chuy\u00ean gia \u0111\u00e1nh gi\u00e1 so s\u00e1nh, b\u1ea1n c\u00f3 th\u1ec3 c\u1ea5u h\u00ecnh kh\u1ea3 n\u0103ng hi\u1ec3n th\u1ecb c\u00e1c th\u00e0nh ph\u1ea7n kh\u00e1c nhau c\u1ee7a h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n \u0111\u1ed1i v\u1edbi c\u00e1c chuy\u00ean gia n\u00e0y trong tab "$\:edit.step.references.visibility".
edit.form_description.configuration=C\u1ea5u h\u00ecnh v\u1ecb tr\u00ed b\u00ean d\u01b0\u1edbi b\u1eb1ng c\u00e1ch ch\u1ecdn c\u00e1c t\u00f9y ch\u1ecdn ph\u00f9 h\u1ee3p v\u1edbi v\u1ecb tr\u00ed n\u00e0y. T\u1ea5t c\u1ea3 c\u00e1c tr\u01b0\u1eddng c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c ch\u1ec9nh s\u1eeda \u1edf giai \u0111o\u1ea1n sau.
edit.form_description.decision=B\u1eadt/t\u1eaft c\u00f4ng c\u1ee5 quy\u1ebft \u0111\u1ecbnh, c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng trong cu\u1ed9c h\u1ecdp h\u1ed9i \u0111\u1ed3ng. C\u00f3 th\u1ec3 t\u1ea1o tr\u1ef1c ti\u1ebfp c\u00e1c ti\u00eau ch\u00ed \u0111\u00e1nh gi\u00e1 quy\u1ebft \u0111\u1ecbnh trong c\u00f4ng c\u1ee5 n\u00e0y.
edit.form_description.document=Ch\u1ecdn t\u1eeb danh s\u00e1ch b\u00ean d\u01b0\u1edbi c\u00e1c t\u00e0i li\u1ec7u b\u1ea1n y\u00eau c\u1ea7u \u0111\u1ed1i v\u1edbi v\u1ecb tr\u00ed n\u00e0y. Nh\u1ea5p v\u00e0o "Ch\u1ec9nh s\u1eeda" \u0111\u1ec3 \u0111i\u1ec1u ch\u1ec9nh th\u00eam c\u00e1c th\u00f4ng tin chi ti\u1ebft c\u1ee7a t\u00e0i li\u1ec7u.
edit.form_description.experts=Ch\u1ecdn xem nh\u00e2n vi\u00ean c\u00f3 th\u1ec3 th\u00eam chuy\u00ean gia hay kh\u00f4ng; n\u1ebfu c\u00f3, h\u00e3y c\u1ea5u h\u00ecnh c\u00e1c chi ti\u1ebft b\u00ean d\u01b0\u1edbi. Chuy\u00ean gia \u0111\u01b0\u1ee3c c\u1ea5p quy\u1ec1n truy c\u1eadp v\u00e0o m\u1ed9t h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n v\u00e0 c\u00f3 th\u1ec3 t\u1ea3i l\u00ean m\u1ed9t t\u1ec7p ch\u1ee9a \u0111\u00e1nh gi\u00e1 c\u1ee7a chuy\u00ean gia v\u1ec1 h\u1ed3 s\u01a1 \u0111\u00f3.<br>Sau khi b\u1eadt chuy\u00ean gia, b\u1ea1n c\u00f3 th\u1ec3 c\u1ea5u h\u00ecnh kh\u1ea3 n\u0103ng hi\u1ec3n th\u1ecb c\u00e1c th\u00e0nh ph\u1ea7n kh\u00e1c nhau c\u1ee7a h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n \u0111\u1ed1i v\u1edbi c\u00e1c chuy\u00ean gia n\u00e0y trong tab "$\:edit.step.references.visibility".
edit.form_description.public.feedback=Ch\u1ecdn xem h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n c\u00f3 li\u00ean k\u1ebft ph\u1ea3n h\u1ed3i c\u00f4ng khai hay kh\u00f4ng. N\u1ebfu c\u00f3, b\u1ea1n c\u00f3 th\u1ec3 nh\u1eadp th\u1eddi h\u1ea1n n\u1ed9p b\u00ean d\u01b0\u1edbi. T\u1ea5t c\u1ea3 c\u00e1c tr\u01b0\u1eddng c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c ch\u1ec9nh s\u1eeda \u1edf giai \u0111o\u1ea1n sau. N\u1ebfu li\u00ean k\u1ebft ph\u1ea3n h\u1ed3i c\u00f4ng khai \u0111\u01b0\u1ee3c b\u1eadt, c\u00e1c li\u00ean k\u1ebft c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c sao ch\u00e9p \u0111\u1ec3 chia s\u1ebb (m\u1ed7i h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n c\u00f3 m\u1ed9t li\u00ean k\u1ebft). C\u00e1c li\u00ean k\u1ebft ch\u1ec9 c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c truy c\u1eadp sau khi \u0111\u0103ng nh\u1eadp. \u0110\u1ed1i v\u1edbi ng\u01b0\u1eddi truy c\u1eadp li\u00ean k\u1ebft, ch\u1ec9 t\u00ean c\u1ee7a \u1ee9ng vi\u00ean \u0111\u01b0\u1ee3c hi\u1ec3n th\u1ecb.
edit.form_description.referees=Ch\u1ecdn xem nh\u00e2n vi\u00ean c\u00f3 th\u1ec3 th\u00eam chuy\u00ean gia hay kh\u00f4ng v\u00e0 \u1ee9ng vi\u00ean c\u00f3 th\u1ec3 cung c\u1ea5p ng\u01b0\u1eddi tham chi\u1ebfu hay kh\u00f4ng. N\u1ebfu c\u00f3, b\u1ea1n c\u00f3 th\u1ec3 c\u1ea5u h\u00ecnh c\u00e1c chi ti\u1ebft b\u00ean d\u01b0\u1edbi. T\u1ea5t c\u1ea3 c\u00e1c tr\u01b0\u1eddng c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c ch\u1ec9nh s\u1eeda \u1edf giai \u0111o\u1ea1n sau.
edit.form_description.referees.management=Ch\u1ecdn xem \u1ee9ng vi\u00ean c\u00f3 th\u1ec3 cung c\u1ea5p v\u00e0 qu\u1ea3n l\u00fd ng\u01b0\u1eddi tham chi\u1ebfu hay kh\u00f4ng; n\u1ebfu c\u00f3, h\u00e3y c\u1ea5u h\u00ecnh c\u00e1c chi ti\u1ebft b\u00ean d\u01b0\u1edbi.<br>L\u01b0u \u00fd r\u1eb1ng n\u1ebfu \u1ee9ng vi\u00ean c\u00f3 th\u1ec3 qu\u1ea3n l\u00fd ng\u01b0\u1eddi tham chi\u1ebfu, email \u0111\u1ebfn ng\u01b0\u1eddi tham chi\u1ebfu s\u1ebd lu\u00f4n \u0111\u01b0\u1ee3c g\u1eedi ngay sau khi h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n \u0111\u01b0\u1ee3c n\u1ed9p.<br>Sau khi b\u1eadt ng\u01b0\u1eddi tham chi\u1ebfu, b\u1ea1n c\u00f3 th\u1ec3 c\u1ea5u h\u00ecnh kh\u1ea3 n\u0103ng hi\u1ec3n th\u1ecb c\u00e1c th\u00e0nh ph\u1ea7n kh\u00e1c nhau c\u1ee7a h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n \u0111\u1ed1i v\u1edbi ng\u01b0\u1eddi tham chi\u1ebfu trong tab "$\:edit.step.references.visibility".
edit.form_description.status=X\u00e1c \u0111\u1ecbnh c\u00e1c th\u1eddi h\u1ea1n \u0111\u01b0\u1ee3c ch\u1ec9 \u0111\u1ecbnh v\u00e0 c\u1ea5u h\u00ecnh xem c\u00e1c th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng ch\u01b0a \u0111\u01b0a ra \u0111\u00e1nh gi\u00e1 c\u00f3 \u0111\u01b0\u1ee3c t\u1ef1 \u0111\u1ed9ng nh\u1eafc nh\u1edf qua email hay kh\u00f4ng. S\u1eed d\u1ee5ng tr\u1ea1ng th\u00e1i v\u1ecb tr\u00ed \u0111\u1ec3 c\u00f4ng b\u1ed1 v\u1ecb tr\u00ed \u0111ang tuy\u1ec3n ho\u1eb7c gi\u1eef v\u1ecb tr\u00ed \u1edf tr\u1ea1ng th\u00e1i chu\u1ea9n b\u1ecb. T\u1ea5t c\u1ea3 c\u00e1c tr\u01b0\u1eddng c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c ch\u1ec9nh s\u1eeda \u1edf giai \u0111o\u1ea1n sau.
