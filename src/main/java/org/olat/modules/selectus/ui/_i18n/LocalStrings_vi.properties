edit.steps.explain=<p>Nh\u1ea5p v\u00e0o "$\:edit.steps" \u0111\u1ec3 b\u1eadt/t\u1eaft c\u00e1c b\u01b0\u1edbc s\u1ebd xu\u1ea5t hi\u1ec7n trong quy tr\u00ecnh n\u1ed9p h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n.<br>Nh\u1ea5p v\u00e0o t\u1eebng b\u01b0\u1edbc t\u01b0\u01a1ng \u1ee9ng \u0111\u1ec3 t\u00f9y ch\u1ec9nh v\u00e0 xem tr\u01b0\u1edbc n\u1ed9i dung. C\u00e1c t\u00f9y ch\u1ecdn t\u00f9y ch\u1ec9nh c\u00f3 th\u1ec3 kh\u00e1c nhau gi\u1eefa c\u00e1c b\u01b0\u1edbc.</p><ul><li>\u0110i\u1ec1u ch\u1ec9nh h\u01b0\u1edbng d\u1eabn v\u00e0 n\u1ed9i dung tr\u1ee3 gi\u00fap hi\u1ec3n th\u1ecb trong c\u00e1c b\u01b0\u1edbc kh\u00e1c nhau c\u1ee7a quy tr\u00ecnh n\u1ed9p h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n.</li><li>Th\u00eam c\u00e2u h\u1ecfi t\u00f9y ch\u1ec9nh v\u00e0o c\u00e1c b\u01b0\u1edbc "$\:edit.step.personal.data", "$\:edit.step.academical.background", v\u00e0 "$\:edit.step.project".</li><li>Ch\u1ecdn c\u00e1c t\u00e0i li\u1ec7u b\u1eaft bu\u1ed9c \u1ee9ng vi\u00ean ph\u1ea3i n\u1ed9p trong b\u01b0\u1edbc "$\:edit.step.documents".</li><li>C\u1ea5u h\u00ecnh c\u00e1c t\u00f9y ch\u1ecdn ph\u1ea3n h\u1ed3i trong b\u01b0\u1edbc "$\:edit.step.review.and.submit".</li><li>\u0110i\u1ec1u ch\u1ec9nh n\u1ed9i dung x\u00e1c nh\u1eadn v\u00e0 email m\u00e0 \u1ee9ng vi\u00ean nh\u1eadn \u0111\u01b0\u1ee3c sau khi n\u1ed9p h\u1ed3 s\u01a1 trong b\u01b0\u1edbc "$\:edit.step.confirmation".</li><li>L\u01b0u \u00fd r\u1eb1ng ng\u01b0\u1eddi tham chi\u1ebfu c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c c\u1ea5u h\u00ecnh trong tab "Ng\u01b0\u1eddi tham chi\u1ebfu / chuy\u00ean gia" \u1edf thanh \u0111i\u1ec1u h\u01b0\u1edbng ch\u00ednh c\u1ee7a ch\u1ebf \u0111\u1ed9 ch\u1ec9nh s\u1eeda.</li></ul>
