refereedashboard.notification.body=<p>Th\u00f4ng b\u00e1o \u0111\u01b0\u1ee3c t\u1ea1o t\u1ef1 \u0111\u1ed9ng</p><p>$applicantDearTitleName,</p><p>Tr\u1ea1ng th\u00e1i c\u1ee7a m\u1ed9t ho\u1eb7c nhi\u1ec1u y\u00eau c\u1ea7u tham chi\u1ebfu \u0111\u1ed1i v\u1edbi h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n c\u1ee7a b\u1ea1n cho v\u1ecb tr\u00ed "$positionTitle" \u0111\u00e3 thay \u0111\u1ed5i. B\u1ea1n c\u00f3 th\u1ec3 ki\u1ec3m tra th\u00f4ng tin chi ti\u1ebft b\u1eb1ng c\u00e1ch truy c\u1eadp li\u00ean k\u1ebft sau v\u00e0 \u0111\u0103ng nh\u1eadp v\u00e0o c\u00f4ng c\u1ee5 tuy\u1ec3n d\u1ee5ng gi\u1ea3ng vi\u00ean\: $applicantURL<p>Tr\u00e2n tr\u1ecdng,<br>$\!headFirstName $\!headLastName</p>
