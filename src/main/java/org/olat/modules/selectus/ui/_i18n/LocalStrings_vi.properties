apply_application.email.referee.mgmt=<p>Th\u00f4ng b\u00e1o \u0111\u01b0\u1ee3c t\u1ea1o t\u1ef1 \u0111\u1ed9ng</p><p>$applicantDearTitleName,</p><p>C\u1ea3m \u01a1n b\u1ea1n \u0111\u00e3 \u1ee9ng tuy\u1ec3n v\u00e0o "$positionTitle". H\u1ed3 s\u01a1 c\u1ee7a b\u1ea1n s\u1ebd \u0111\u01b0\u1ee3c chuy\u1ec3n \u0111\u1ebfn h\u1ed9i \u0111\u1ed3ng tuy\u1ec3n ch\u1ecdn.</p><p>Trong qu\u00e1 tr\u00ecnh \u1ee9ng tuy\u1ec3n, h\u1ed9i \u0111\u1ed3ng y\u00eau c\u1ea7u c\u00e1c th\u01b0 gi\u1edbi thi\u1ec7u. Vui l\u00f2ng s\u1eed d\u1ee5ng li\u00ean k\u1ebft b\u00ean d\u01b0\u1edbi \u0111\u1ec3 \u0111\u0103ng nh\u1eadp v\u00e0o c\u00f4ng c\u1ee5 tuy\u1ec3n d\u1ee5ng gi\u1ea3ng vi\u00ean v\u00e0 theo d\u00f5i tr\u1ea1ng th\u00e1i c\u00e1c y\u00eau c\u1ea7u gi\u1edbi thi\u1ec7u. B\u1ea1n c\u00f3 th\u1ec3 ch\u1ec9 \u0111\u1ecbnh th\u00eam ng\u01b0\u1eddi gi\u1edbi thi\u1ec7u n\u1ebfu m\u1ed9t ng\u01b0\u1eddi gi\u1edbi thi\u1ec7u t\u1eeb ch\u1ed1i y\u00eau c\u1ea7u g\u1eedi th\u01b0 gi\u1edbi thi\u1ec7u. C\u00e1c th\u01b0 \u0111\u00e3 g\u1eedi \u0111\u01b0\u1ee3c gi\u1eef b\u00ed m\u1eadt v\u00e0 kh\u00f4ng cung c\u1ea5p cho b\u1ea1n.<br>$applicantURL</p><p>Vi\u1ec7c \u0111\u00e1nh gi\u00e1 c\u00e1c h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n s\u1ebd c\u1ea7n kh\u00e1 nhi\u1ec1u th\u1eddi gian. Ch\u00fang t\u00f4i s\u1ebd th\u00f4ng b\u00e1o cho b\u1ea1n ngay khi h\u1ed9i \u0111\u1ed3ng \u0111\u01b0a ra quy\u1ebft \u0111\u1ecbnh.</p><p>Tr\u00e2n tr\u1ecdng,<br>Office for Faculty Affairs</p>
