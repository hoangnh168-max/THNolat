rejection.mail.body=<p>K\u00ednh g\u1eedi $nameAndTitle</p><p>T\u00f4i vi\u1ebft th\u01b0 n\u00e0y li\u00ean quan \u0111\u1ebfn h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n c\u1ee7a b\u1ea1n cho v\u1ecb tr\u00ed n\u00eau tr\u00ean.</p><p>H\u1ed9i \u0111\u1ed3ng tuy\u1ec3n ch\u1ecdn t\u01b0 v\u1ea5n cho t\u00f4i v\u1ec1 v\u1ea5n \u0111\u1ec1 n\u00e0y \u0111\u00e3 nghi\u00ean c\u1ee9u k\u1ef9 l\u01b0\u1ee1ng c\u00e1c h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n. Sau qu\u00e1 tr\u00ecnh th\u1ea3o lu\u1eadn chuy\u00ean s\u00e2u, c\u00e1c th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng \u0111\u00e3 \u0111\u1ec1 ngh\u1ecb t\u00f4i xem x\u00e9t c\u00e1c \u1ee9ng vi\u00ean kh\u00e1c trong qu\u00e1 tr\u00ecnh tuy\u1ec3n ch\u1ecdn. T\u00f4i \u0111\u00e3 quy\u1ebft \u0111\u1ecbnh l\u00e0m theo \u0111\u1ec1 ngh\u1ecb n\u00e0y v\u00e0 r\u1ea5t ti\u1ebfc ph\u1ea3i th\u00f4ng b\u00e1o r\u1eb1ng h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n c\u1ee7a b\u1ea1n s\u1ebd kh\u00f4ng \u0111\u01b0\u1ee3c ti\u1ebfp t\u1ee5c xem x\u00e9t.</p><p>T\u00f4i r\u1ea5t tr\u00e2n tr\u1ecdng vi\u1ec7c b\u1ea1n \u0111\u00e3 d\u00e0nh th\u1eddi gian \u1ee9ng tuy\u1ec3n v\u00e0o v\u1ecb tr\u00ed n\u00e0y v\u00e0 ch\u00fac b\u1ea1n th\u00e0nh c\u00f4ng trong s\u1ef1 nghi\u1ec7p.</p><p>Tr\u00e2n tr\u1ecdng,<br>$headFirstname $headLastname<br>Tr\u01b0\u1edfng H\u1ed9i \u0111\u1ed3ng</p>
rejection.mail.bonhold.subject=H\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n c\u1ee7a b\u1ea1n
rejection.mail.bonhold.body=<p>$dearTitleAndName,</p><p>Ch\u00fang t\u00f4i r\u1ea5t tr\u00e2n tr\u1ecdng vi\u1ec7c b\u1ea1n \u0111\u00e3 d\u00e0nh th\u1eddi gian \u1ee9ng tuy\u1ec3n v\u00e0o "{0}". Ch\u00fang t\u00f4i c\u0169ng c\u1ea3m \u01a1n b\u1ea1n v\u00ec s\u1ef1 quan t\u00e2m.</p><p>Ch\u00fang t\u00f4i r\u1ea5t ti\u1ebfc ph\u1ea3i th\u00f4ng b\u00e1o r\u1eb1ng h\u1ed9i \u0111\u1ed3ng \u0111\u00e3 quy\u1ebft \u0111\u1ecbnh kh\u00f4ng \u0111\u01b0a h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n c\u1ee7a b\u1ea1n v\u00e0o v\u00f2ng ti\u1ebfp theo c\u1ee7a quy tr\u00ecnh tuy\u1ec3n ch\u1ecdn. Tuy nhi\u00ean, n\u1ebfu b\u1ea1n \u0111\u1ed3ng \u00fd, H\u1ed9i \u0111\u1ed3ng tuy\u1ec3n ch\u1ecdn mu\u1ed1n gi\u1eef h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n c\u1ee7a b\u1ea1n \u1edf tr\u1ea1ng th\u00e1i ch\u1edd cho \u0111\u1ebfn khi k\u1ebft th\u00fac quy tr\u00ecnh tuy\u1ec3n d\u1ee5ng. Sau \u0111\u00f3, ch\u00fang t\u00f4i s\u1ebd x\u00f3a h\u1ed3 s\u01a1 \u0111\u1ec3 b\u1ea3o v\u1ec7 quy\u1ec1n ri\u00eang t\u01b0 c\u1ee7a b\u1ea1n. B\u1ea1n s\u1ebd \u0111\u01b0\u1ee3c th\u00f4ng b\u00e1o t\u01b0\u01a1ng \u1ee9ng.</p><p>Tr\u00e2n tr\u1ecdng,<br>Prof. Dr. {2}<br>Tr\u01b0\u1edfng H\u1ed9i \u0111\u1ed3ng<br></p>
rejection.mail.crejection.subject=H\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n c\u1ee7a b\u1ea1n
rejection.mail.crejection.body=<p>$dearTitleAndName</p><pCh\u00fang t\u00f4i r\u1ea5t tr\u00e2n tr\u1ecdng vi\u1ec7c b\u1ea1n \u0111\u00e3 d\u00e0nh th\u1eddi gian \u1ee9ng tuy\u1ec3n v\u00e0o "{0}". Ch\u00fang t\u00f4i c\u0169ng c\u1ea3m \u01a1n b\u1ea1n v\u00ec s\u1ef1 quan t\u00e2m.</p><p>T\u00f4i r\u1ea5t ti\u1ebfc ph\u1ea3i th\u00f4ng b\u00e1o r\u1eb1ng H\u1ed9i \u0111\u1ed3ng tuy\u1ec3n ch\u1ecdn \u0111\u00e3 kh\u00f4ng l\u1ef1a ch\u1ecdn b\u1ea1n cho v\u1ecb tr\u00ed n\u00e0y. V\u00ec l\u00fd do b\u1ea3o v\u1ec7 d\u1eef li\u1ec7u, h\u1ed3 s\u01a1 c\u1ee7a b\u1ea1n s\u1ebd b\u1ecb x\u00f3a.</p><p>Thay m\u1eb7t H\u1ed9i \u0111\u1ed3ng tuy\u1ec3n ch\u1ecdn, t\u00f4i xin ch\u00fac b\u1ea1n m\u1ecdi \u0111i\u1ec1u t\u1ed1t \u0111\u1eb9p nh\u1ea5t trong nh\u1eefng d\u1ef1 \u0111\u1ecbnh t\u01b0\u01a1ng lai.</p><p>Tr\u00e2n tr\u1ecdng,<br>Prof. Dr. {2}<br>Tr\u01b0\u1edfng H\u1ed9i \u0111\u1ed3ng<br></p>
