reference.comparative.expert.mail.body=<p>$refereeDearTitleName,</p><p>T\u00f4i vi\u1ebft th\u01b0 n\u00e0y li\u00ean quan \u0111\u1ebfn qu\u00e1 tr\u00ecnh tuy\u1ec3n d\u1ee5ng cho v\u1ecb tr\u00ed \u0111ang tuy\u1ec3n "$positionTitle".</p><p>H\u1ed9i \u0111\u1ed3ng tuy\u1ec3n ch\u1ecdn \u0111ang xem x\u00e9t c\u00e1c \u1ee9ng vi\u00ean sau cho v\u1ecb tr\u00ed n\u00e0y\:<br>$applicantList</p><p>V\u00ec b\u1ea1n l\u00e0 chuy\u00ean gia trong l\u0129nh v\u1ef1c n\u00e0y, ch\u00fang t\u00f4i r\u1ea5t mong b\u1ea1n s\u1eb5n l\u00f2ng h\u1ed7 tr\u1ee3 \u0111\u00e1nh gi\u00e1 v\u00e0 vi\u1ebft b\u1ea3n \u0111\u00e1nh gi\u00e1 so s\u00e1nh v\u1ec1 m\u1ee9c \u0111\u1ed9 ph\u00f9 h\u1ee3p c\u1ee7a c\u00e1c \u1ee9ng vi\u00ean n\u00e0y \u0111\u1ed1i v\u1edbi v\u1ecb tr\u00ed \u0111ang tuy\u1ec3n. Ch\u00fang t\u00f4i mong nh\u1eadn \u0111\u01b0\u1ee3c b\u1ea3n \u0111\u00e1nh gi\u00e1 chuy\u00ean m\u00f4n c\u1ee7a b\u1ea1n s\u1edbm nh\u1ea5t c\u00f3 th\u1ec3, nh\u01b0ng kh\u00f4ng mu\u1ed9n h\u01a1n $refereeDeadline.</p><p>Vui l\u00f2ng truy c\u1eadp li\u00ean k\u1ebft d\u01b0\u1edbi \u0111\u00e2y \u0111\u1ec3 ch\u1ea5p nh\u1eadn y\u00eau c\u1ea7u, xem th\u00f4ng tin v\u1ec1 c\u00e1c \u1ee9ng vi\u00ean c\u0169ng nh\u01b0 y\u00eau c\u1ea7u c\u1ee7a v\u1ecb tr\u00ed v\u00e0 t\u1ea3i l\u00ean b\u1ea3n \u0111\u00e1nh gi\u00e1 chuy\u00ean gia d\u01b0\u1edbi d\u1ea1ng m\u1ed9t t\u1ec7p PDF duy nh\u1ea5t. N\u1ebfu b\u1ea1n kh\u00f4ng th\u1ec3 th\u1ef1c hi\u1ec7n vai tr\u00f2 chuy\u00ean gia, vui l\u00f2ng th\u00f4ng b\u00e1o cho ch\u00fang t\u00f4i b\u1eb1ng c\u00e1ch truy c\u1eadp c\u00f9ng li\u00ean k\u1ebft v\u00e0 t\u1eeb ch\u1ed1i y\u00eau c\u1ea7u\:<br>$refereeUrl</p><p>Tr\u00e2n tr\u1ecdng,<br>$headFirstname $headLastname<br>Tr\u01b0\u1edfng H\u1ed9i \u0111\u1ed3ng tuy\u1ec3n ch\u1ecdn</p>
