disclaimer.privacy.text=<h5>Thu th\u1eadp d\u1eef li\u1ec7u</h5><p>Khi s\u1eed d\u1ee5ng Selectus, d\u1eef li\u1ec7u s\u1ebd \u0111\u01b0\u1ee3c l\u01b0u tr\u1eef. V\u00ec m\u1ee5c \u0111\u00edch truy xu\u1ea5t v\u00e0 ki\u1ec3m tra, \u0111i\u1ec1u n\u00e0y c\u0169ng \u00e1p d\u1ee5ng trong tr\u01b0\u1eddng h\u1ee3p quy tr\u00ecnh b\u1ecb gi\u00e1n \u0111o\u1ea1n.</p><p>D\u1eef li\u1ec7u c\u00e1 nh\u00e2n nh\u01b0 h\u1ecd t\u00ean, email v\u00e0 \u0111\u1ecba ch\u1ec9 \u0111\u01b0\u1ee3c thu th\u1eadp. D\u1eef li\u1ec7u v\u00e0 t\u00e0i li\u1ec7u \u0111\u00e3 n\u1ed9p s\u1ebd hi\u1ec3n th\u1ecb cho h\u1ed9i \u0111\u1ed3ng \u0111\u00e1nh gi\u00e1 v\u00e0, n\u1ebfu c\u00f3, cho c\u00e1c chuy\u00ean gia v\u00e0 ng\u01b0\u1eddi \u0111\u00e1nh gi\u00e1. Ngo\u00e0i ra, c\u00e1c d\u1eef li\u1ec7u tr\u1ef1c tuy\u1ebfn nh\u01b0 \u0111\u1ecba ch\u1ec9 IP, v\u1ecb tr\u00ed, phi\u00ean b\u1ea3n tr\u00ecnh duy\u1ec7t v\u00e0 ng\u00e0y gi\u1edd truy c\u1eadp c\u0169ng \u0111\u01b0\u1ee3c ghi nh\u1eadn. D\u1eef li\u1ec7u n\u00e0y \u0111\u01b0\u1ee3c l\u01b0u trong c\u00e1c t\u1ec7p nh\u1eadt k\u00fd nh\u1eb1m ph\u1ee5c v\u1ee5 vi\u1ec7c truy xu\u1ea5t v\u00e0 ki\u1ec3m tra.</p><p>Sau khi quy tr\u00ecnh ho\u00e0n t\u1ea5t, d\u1eef li\u1ec7u s\u1ebd \u0111\u01b0\u1ee3c l\u01b0u gi\u1eef th\u00eam hai n\u0103m v\u00e0 sau \u0111\u00f3 b\u1ecb x\u00f3a v\u0129nh vi\u1ec5n.</p><h5>Truy\u1ec1n d\u1eef li\u1ec7u</h5><p>T\u1ea5t c\u1ea3 l\u01b0u l\u01b0\u1ee3ng d\u1eef li\u1ec7u \u0111\u1ec1u \u0111\u01b0\u1ee3c m\u00e3 h\u00f3a. C\u00e1c m\u00e1y ch\u1ee7 l\u01b0u tr\u1eef d\u1eef li\u1ec7u thu\u1ed9c s\u1edf h\u1eefu c\u1ee7a frentix GmbH v\u00e0 \u0111\u1eb7t t\u1ea1i Th\u1ee5y S\u0129.</p><h5>X\u00f3a ho\u1eb7c xem d\u1eef li\u1ec7u</h5><p>PVui l\u00f2ng g\u1eedi y\u00eau c\u1ea7u x\u00f3a ho\u1eb7c xem d\u1eef li\u1ec7u c\u1ee7a b\u1ea1n \u0111\u1ebfn datenschutz@frentix.com. Sau khi x\u00f3a, d\u1eef li\u1ec7u s\u1ebd ti\u1ebfp t\u1ee5c \u0111\u01b0\u1ee3c l\u01b0u trong c\u00e1c b\u1ea3n sao l\u01b0u th\u00eam ba th\u00e1ng tr\u01b0\u1edbc khi b\u1ecb x\u00f3a ho\u00e0n to\u00e0n. Vi\u1ec7c xu\u1ea5t d\u1eef li\u1ec7u kh\u00f4ng cung c\u1ea5p b\u1ea5t k\u1ef3 th\u00f4ng tin n\u00e0o v\u1ec1 qu\u00e1 tr\u00ecnh \u0111\u00e1nh gi\u00e1 ho\u1eb7c th\u1ea9m \u0111\u1ecbnh h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n c\u1ee7a b\u1ea1n.</p><h5>X\u00e1c nh\u1eadn</h5>
