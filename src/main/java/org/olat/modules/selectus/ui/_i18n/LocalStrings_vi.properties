refereedashboard.new.password=Vui l\u00f2ng ki\u1ec3m tra email c\u1ee7a b\u1ea1n. M\u1ed9t email ch\u1ee9a th\u00f4ng tin v\u1ec1 t\u00ean ng\u01b0\u1eddi d\u00f9ng v\u00e0 m\u1eadt kh\u1ea9u \u0111\u00e3 \u0111\u01b0\u1ee3c g\u1eedi \u0111\u1ebfn b\u1ea1n.
refereedashboard.new.password.body=<p>{1},</p><p>\u1ec3 \u0111\u0103ng nh\u1eadp v\u00e0o c\u00f4ng c\u1ee5 tuy\u1ec3n d\u1ee5ng gi\u1ea3ng vi\u00ean, b\u1ea1n c\u1ea7n c\u00f3 t\u00ean ng\u01b0\u1eddi d\u00f9ng v\u00e0 m\u1eadt kh\u1ea9u.</p><p>T\u00ean ng\u01b0\u1eddi d\u00f9ng t\u01b0\u01a1ng \u1ee9ng v\u1edbi \u0111\u1ecba ch\u1ec9 email li\u00ean h\u1ec7 m\u00e0 b\u1ea1n \u0111\u00e3 cung c\u1ea5p trong h\u1ed3 s\u01a1 \u1ee9ng tuy\u1ec3n.</p><p>M\u1eadt kh\u1ea9u c\u1ee7a b\u1ea1n\: {2}</p><p>Vui l\u00f2ng l\u01b0u l\u1ea1i m\u1eadt kh\u1ea9u n\u00e0y \u0111\u1ec3 s\u1eed d\u1ee5ng trong t\u01b0\u01a1ng lai.</p>
