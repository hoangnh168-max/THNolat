edit.rating.policy.points.confidentiality=Ch\u00fang t\u00f4i k\u00ednh \u0111\u1ec1 ngh\u1ecb b\u1ea1n gi\u1eef tuy\u1ec7t \u0111\u1ed1i b\u00ed m\u1eadt m\u1ecdi th\u00f4ng tin v\u00e0 t\u00e0i li\u1ec7u. T\u1ea5t c\u1ea3 t\u00e0i li\u1ec7u v\u00e0 th\u00f4ng tin b\u1eb1ng l\u1eddi n\u00f3i li\u00ean quan \u0111\u1ebfn c\u00e1c \u1ee9ng vi\u00ean m\u00e0 h\u1ed9i \u0111\u1ed3ng tuy\u1ec3n ch\u1ecdn thu th\u1eadp \u0111\u01b0\u1ee3c trong su\u1ed1t qu\u00e1 tr\u00ecnh chu\u1ea9n b\u1ecb quy tr\u00ecnh tuy\u1ec3n ch\u1ecdn \u0111\u1ec1u thu\u1ed9c ph\u1ea1m vi b\u1ea3o m\u1eadt.<br/>C\u00e1c t\u00e0i li\u1ec7u ch\u1ec9 d\u00e0nh ri\u00eang cho c\u00e1c th\u00e0nh vi\u00ean c\u1ee7a h\u1ed9i \u0111\u1ed3ng tuy\u1ec3n ch\u1ecdn. Kh\u00f4ng \u0111\u01b0\u1ee3c sao ch\u00e9p t\u00e0i li\u1ec7u ho\u1eb7c cung c\u1ea5p quy\u1ec1n ti\u1ebfp c\u1eadn t\u00e0i li\u1ec7u d\u01b0\u1edbi b\u1ea5t k\u1ef3 h\u00ecnh th\u1ee9c n\u00e0o kh\u00e1c cho b\u00ean th\u1ee9 ba. M\u1ecdi t\u00e0i li\u1ec7u \u0111\u01b0\u1ee3c t\u1ea3i xu\u1ed1ng ho\u1eb7c in ra ph\u1ea3i \u0111\u01b0\u1ee3c x\u00f3a ho\u1eb7c ti\u00eau h\u1ee7y sau khi quy tr\u00ecnh k\u1ebft th\u00fac.<br/>C\u00e1c \u0111\u00e1nh gi\u00e1 c\u1ee7a b\u1ea1n trong c\u00f4ng c\u1ee5 \u0111\u01b0\u1ee3c \u1ea9n danh \u0111\u1ed1i v\u1edbi nh\u00e2n vi\u00ean, tr\u01b0\u1edfng h\u1ed9i \u0111\u1ed3ng v\u00e0 c\u00e1c th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng kh\u00e1c.<br/>Nh\u1eadn x\u00e9t c\u1ee7a b\u1ea1n mang t\u00ednh c\u00e1 nh\u00e2n. Nh\u00e2n vi\u00ean, tr\u01b0\u1edfng h\u1ed9i \u0111\u1ed3ng v\u00e0 c\u00e1c th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng kh\u00e1c kh\u00f4ng c\u00f3 quy\u1ec1n truy c\u1eadp. Sau khi to\u00e0n b\u1ed9 quy tr\u00ecnh k\u1ebft th\u00fac, t\u1ea5t c\u1ea3 d\u1eef li\u1ec7u li\u00ean quan s\u1ebd \u0111\u01b0\u1ee3c x\u00f3a kh\u1ecfi m\u00e1y ch\u1ee7.
