confirm.delete.anonymous=V\u1ecb tr\u00ed "{0}" \u0111\u01b0\u1ee3c ch\u1ecdn c\u00f9ng t\u1ea5t c\u1ea3 t\u00e0i li\u1ec7u v\u00e0 to\u00e0n b\u1ed9 d\u1eef li\u1ec7u cho ph\u00e9p x\u00e1c \u0111\u1ecbnh danh t\u00ednh c\u1ee7a b\u1ea5t k\u1ef3 c\u00e1 nh\u00e2n n\u00e0o (\u1ee9ng vi\u00ean, th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng, ng\u01b0\u1eddi tham chi\u1ebfu/chuy\u00ean gia, v.v.) s\u1ebd b\u1ecb x\u00f3a v\u0129nh vi\u1ec5n. Ch\u1ec9 m\u1ed9t s\u1ed1 d\u1eef li\u1ec7u \u0111\u00e3 \u0111\u01b0\u1ee3c \u1ea9n danh nh\u1ea5t \u0111\u1ecbnh s\u1ebd \u0111\u01b0\u1ee3c gi\u1eef l\u1ea1i \u0111\u1ec3 l\u1eadp b\u00e1o c\u00e1o th\u1ed1ng k\u00ea. V\u1ecb tr\u00ed s\u1ebd chuy\u1ec3n sang tr\u1ea1ng th\u00e1i "B\u00e1o c\u00e1o", v\u00e0 kh\u00f4ng th\u1ec3 ho\u00e0n t\u00e1c thao t\u00e1c n\u00e0y, ngo\u1ea1i tr\u1eeb vi\u1ec7c x\u00f3a ho\u00e0n to\u00e0n v\u1ecb tr\u00ed.
confirm.delete.anonymous.2=Tr\u01b0\u1edbc khi ti\u1ebfp t\u1ee5c, vui l\u00f2ng <strong>ki\u1ec3m tra v\u00e0 ho\u00e0n thi\u1ec7n c\u00e1c th\u00f4ng tin b\u1ed5 sung sau \u0111\u00e2y v\u1ec1 v\u1ecb tr\u00ed</strong> v\u00ec c\u00e1c th\u00f4ng tin n\u00e0y c\u1ea7n thi\u1ebft cho vi\u1ec7c l\u1eadp b\u00e1o c\u00e1o. B\u1ea1n c\u0169ng c\u00f3 th\u1ec3 ho\u00e0n thi\u1ec7n d\u1eef li\u1ec7u \u1edf giai \u0111o\u1ea1n sau, <strong>nh\u01b0ng sau \u0111\u00f3 b\u1ea1n s\u1ebd kh\u00f4ng th\u1ec3 truy c\u1eadp ho\u1eb7c thay \u0111\u1ed5i b\u1ea5t k\u1ef3 d\u1eef li\u1ec7u n\u00e0o kh\u00e1c.</strong>
confirm.delete.anonymous.option.1=V\u1ecb tr\u00ed s\u1ebd b\u1ecb x\u00f3a v\u0129nh vi\u1ec5n v\u00e0 ch\u1ec9 m\u1ed9t s\u1ed1 d\u1eef li\u1ec7u \u0111\u00e3 \u0111\u01b0\u1ee3c \u1ea9n danh nh\u1ea5t \u0111\u1ecbnh s\u1ebd \u0111\u01b0\u1ee3c gi\u1eef l\u1ea1i. Thao t\u00e1c n\u00e0y kh\u00f4ng th\u1ec3 ho\u00e0n t\u00e1c.
