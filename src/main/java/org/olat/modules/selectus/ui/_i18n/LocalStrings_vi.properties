referee.submission.notification.body=<p>$refereeDearTitleName,</p><p>Th\u01b0 gi\u1edbi thi\u1ec7u c\u1ee7a b\u1ea1n d\u00e0nh cho $applicantTitleFirstLastName \u0111\u1ed1i v\u1edbi v\u1ecb tr\u00ed "$positionTitle" \u0111\u00e3 \u0111\u01b0\u1ee3c g\u1eedi th\u00e0nh c\u00f4ng.</p><p>Xin ch\u00e2n th\u00e0nh c\u1ea3m \u01a1n s\u1ef1 h\u1ed7 tr\u1ee3 qu\u00fd b\u00e1u c\u1ee7a b\u1ea1n\!</p><p>Tr\u00e2n tr\u1ecdng,<br>$\!headFirstname $\!headLastname<br>Tr\u01b0\u1edfng H\u1ed9i \u0111\u1ed3ng tuy\u1ec3n ch\u1ecdn</p>
