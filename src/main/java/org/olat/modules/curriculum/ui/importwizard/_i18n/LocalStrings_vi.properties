import.curriculums.infos.file1=T\u1ec7p Excel v\u00e0 n\u1ed9i dung c\u1ee7a t\u1ec7p ph\u1ea3i \u0111\u00e1p \u1ee9ng c\u00e1c \u0111i\u1ec1u ki\u1ec7n sau:<ul><li>Ph\u1ea3i c\u00f3 trang "Products"</li><li>T\u1ea5t c\u1ea3 c\u00e1c tr\u01b0\u1eddng b\u1eaft bu\u1ed9c ph\u1ea3i \u0111\u01b0\u1ee3c \u0111i\u1ec1n (\u0111\u01b0\u1ee3c \u0111\u00e1nh d\u1ea5u b\u1eb1ng d\u1ea5u hoa th\u1ecb)</li><li>Ch\u1ec9 m\u1ed9t s\u1ed1 thu\u1ed9c t\u00ednh nh\u1ea5t \u0111\u1ecbnh c\u1ee7a c\u00e1c ph\u1ea7n t\u1eed c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c c\u1eadp nh\u1eadt - c\u00e1c thu\u1ed9c t\u00ednh kh\u00e1c s\u1ebd b\u1ecb b\u1ecf qua</li><li>C\u00e1c tham chi\u1ebfu ph\u1ea3i l\u00e0 duy nh\u1ea5t trong to\u00e0n b\u1ed9 h\u1ec7 th\u1ed1ng</li><li>C\u00e1c t\u1ed5 ch\u1ee9c, lo\u1ea1i ph\u1ea7n t\u1eed v\u00e0 m\u00f4n h\u1ecdc ph\u1ea3i t\u1ed3n t\u1ea1i trong h\u1ec7 th\u1ed1ng</li></ul>
