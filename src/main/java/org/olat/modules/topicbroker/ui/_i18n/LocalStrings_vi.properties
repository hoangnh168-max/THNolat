email.enrollment.partially.body=Xin ch\u00e0o $recipientDisplayName<br><br>Ch\u00fang t\u00f4i x\u00e1c nh\u1eadn vi\u1ec7c ghi danh c\u1ee7a b\u1ea1n d\u1ef1a tr\u00ean c\u00e1c l\u1ef1a ch\u1ecdn, m\u1ee9c \u0111\u1ed9 \u01b0u ti\u00ean v\u00e0 s\u1ed1 ch\u1ed7 c\u00f2n tr\u1ed1ng:<br>$enrollmentList<br>R\u1ea5t ti\u1ebfc, l\u1ef1a ch\u1ecdn c\u1ee7a b\u1ea1n kh\u00f4ng th\u1ec3 \u0111\u01b0\u1ee3c \u0111\u00e1p \u1ee9ng \u0111\u1ea7y \u0111\u1ee7.<br><br>C\u00f3 th\u1ec3 do nh\u1eefng nguy\u00ean nh\u00e2n sau:<br>- Ch\u1ee7 \u0111\u1ec1 ch\u01b0a \u0111\u1ea1t s\u1ed1 l\u01b0\u1ee3ng ng\u01b0\u1eddi tham gia t\u1ed1i thi\u1ec3u.<br>- Ch\u1ee7 \u0111\u1ec1 \u0111\u00e3 v\u01b0\u1ee3t qu\u00e1 s\u1ed1 l\u01b0\u1ee3ng ng\u01b0\u1eddi c\u00f3 th\u1ec3 tham gia.<br>- Ch\u01b0a s\u1eed d\u1ee5ng h\u1ebft s\u1ed1 l\u01b0\u1ee3ng ch\u1ee7 \u0111\u1ec1 \u0111\u01b0\u1ee3c ph\u00e9p l\u1ef1a ch\u1ecdn t\u1ed1i \u0111a.<br><br>Li\u00ean k\u1ebft: $url<br><br>Vui l\u00f2ng li\u00ean h\u1ec7 ng\u01b0\u1eddi h\u01b0\u1edbng d\u1eabn \u0111\u1ec3 bi\u1ebft th\u00eam th\u00f4ng tin.
